// Sentence frames let true beginners produce new language, rather than memorizing translations.
const FRAMES=[
['My name is + 姓名','My name is Alex.','I’m = I am。报姓名后再说 Nice to meet you。'],
['I’m from + 地方 / I live in + 地方','I’m from China. I live in Osaka.','from 表示出身，in 表示居住地。'],
['How about + 时间?','How about seven thirty?','How about 后接时间或提案。'],
['Can I have + 东西, please?','Can I have some water, please?','Can I have 是自然的礼貌请求。'],
['Can I get + 东西?','Can I get a receipt?','可以在服务场景表达希望拿到某物。'],
['Where is + 地点?','Where is the station?','方向问句，where放句首。'],
['Does this + 交通工具 + go to ...?','Does this bus go to Namba?','does 后面动词用原形 go。'],
['Here is + 东西.','Here is my passport.','递交物品时的简单表达。'],
['Could you + 动词原形?','Could you say that again?','could you 比 can you 更委婉。'],
['I have a reservation under + 名字.','I have a reservation under Lee.','under + 姓名表示以谁的名字预订。'],
['I went + 地点 / I did + 活动','I went shopping yesterday.','went 是 go 的过去式。'],
['Could you speak more slowly?','Could you repeat the number?','与其猜测，不如主动确认。'],
['We are + 动词-ing','We are sorting the packages now.','现在正在做的事可以用 be + ing。'],
['Please + 动词原形','Please unload the cargo here.','安排操作时使用please + 动作。'],
['We received only + 数量','We received only 200 packages.','only 强调实际少于预期。'],
['Please + 动词 + and + 动词','Please print it and scan it again.','and连接顺序操作。'],
['Could you confirm + 信息?','Could you confirm the ETA?','ETA = estimated time of arrival。'],
['The flight is delayed by + 时间','The flight is delayed by one hour.','by one hour 表示延误幅度。'],
['We need to check + 文件','We need to check the invoice.','need to 后接动词原形。'],
['Who is responsible for + 名词?','Who is responsible for the tax?','responsible for表示负责。'],
['The parcel could not be delivered because ...','It could not be delivered because no one was home.','because引出原因。'],
['Could you arrange + 事项?','Could you arrange a return shipment?','arrange 代表协调安排。'],
['First ..., then ..., finally ...','First we scan, then we sort, finally we dispatch.','用连接词组织说明。'],
['We have two options ...','We have two options to solve this.','先讲选择，再讲利弊。'],
['The main point is ...','The main point is to reduce delays.','开头先表明核心观点。'],
['I’m sorry about ... / I’ll ...','I’m sorry about the issue. I’ll check.','道歉后说明行动，避免空洞道歉。'],
['Could you arrange ... for + 时间?','Could you arrange pickup for Friday?','for后接时间。'],
['We need to confirm ... before ...','We need to check the value before filing.','before后接动作或-ing。'],
['We will ... by + 截止时间','We will report back by noon.','by noon指中午以前，区别于at noon。'],
['Our goal is to ... by ...','Our goal is to reduce delays by changing schedules.','is to 表示目标，by + ing 说明方法。']
];

function training(){let m=mission(),l=m.l,p=m.p;const steps=[['listen','01 盲听'],['shadow','02 跟读'],['speak','03 表达'],['review','04 回忆']];let body=mode==='listen'?listenModule(m):mode==='shadow'?shadowModule(m):mode==='speak'?speakModule(m):reviewModule(m);return `${header('PRACTICE ROOM · DAY '+state.day,'每天，把英语说得更自然。',`情境：${esc(l.scene)} · ${esc(m.label)}`)}<div class="phase-tabs">${steps.map(([id,text])=>`<button data-mode="${id}" class="${mode===id?'sel':''}">${doneMap(state.day)[id]?'✓ ':''}${text}</button>`).join('')}</div><div class="panel slim"><span class="kicker">YOUR ADAPTIVE FOCUS</span><div style="margin-top:5px"><b>重点补强：${focusedSkill()}</b> · ${adaptiveTip()}</div></div>${body}

function listenModule(m){const l=m.l,ans=state.answers[state.day]?.listen??null;const q=l.q;return `<div class="panel"><span class="kicker">01 / INPUT BEFORE TEXT</span><h2>先听，不看英文字幕</h2><p class="hint">听2次，用耳朵理解。第一次正常速度，第二次可降低语速。回答后再展开原文。</p><div class="btnrow"><button class="btn main" data-act="play-dialogue">▶ 播放整段对话</button><button class="btn" data-act="play-slow">▶ 0.75× 慢速</button><button class="btn flat" data-act="stop-tts">■ 停止</button></div><div class="sec"><h2>理解检测</h2></div><p><b>${esc(q[0])}</b></p>${q[1].map((op,i)=>`<button class="choice ${choice===i?'picked':''}" data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(op)}</button>`).join('')}<div class="btnrow"><button class="btn main" data-act="check-listen">检查理解</button><button class="btn flat" data-act="toggle-script">${reveal?'收起':'查看'}逐句原文</button></div>${ans===true?'<div class="feedback">✓ 理解正确。请尝试不看文本，用英文说出刚才发生了什么。</div>':ans===false?'<div class="feedback warn">这次不正确。再听一遍，并注意对方的问题。你可以重新选择。</div>':''}
${reveal?`<div class="dialogue">${l.d.map(row=>`<div class="bubble ${row[0]==='You'?'you':''}"><small>${esc(row[0])}</small><p>${esc(row[1])}</p><div class="trans">${trans(row[2],row[3])}</div><button class="btn flat" data-say="${esc(row[1])}" style="padding:5px;min-height:32px">▶ 朗读这句</button></div>`).join('')}</div>`:''}</div>`}
function shadowModule(m){let cnt=state.shadowCount[state.day]||0;return `<div class="panel"><span class="kicker">02 / MOUTH + MEMORY</span><h2>跟读这句话，至少3遍</h2><p class="scene">${esc(m.target)}</p><div class="callout"><b>今天的可复用句型</b><strong style="font-size:16px;color:var(--mint)">${esc(m.l.frame?.[0]||m.target)}</strong><div>${esc(m.l.frame?.[1]||m.target)}</div><div class="hint" style="margin-top:7px">${esc(m.l.frame?.[2]||'替换关键词，自己造一个新句子。')}</div></div><p class="hint">第一遍慢速模仿发音；第二遍自然语速；第三遍盖住句子复述。录音功能仅用于回听，不会假装给你的发音打分。</p><div class="btnrow"><button class="btn main" data-act="play-target">▶ 听标准句</button><button class="btn" data-act="play-target-slow">▶ 慢速</button><button class="btn" data-act="shadow-rep">我已开口跟读1遍（${cnt}/3）</button></div>${cnt>=3?'<div class="feedback">✓ 已记录3次跟读。推荐录音，对比原音再说一遍。</div>':''}${recorderPanel()}<div class="callout"><b>回听自检：</b>是否遗漏了词？有没有在句子中间异常停顿？重音是否和示范接近？<br><span class="muted">如果 iPhone 不允许网页录音，使用语音备忘录后导入音频也能完成训练。</span></div></div>`}
function speakModule(m){let text=state.notes[state.day]?.speak||'';return `<div class="panel"><span class="kicker">03 / SPEAK WITHOUT THE ANSWER</span><h2>不要看答案，先用英语回答</h2><div class="scene"><b>${esc(m.l.scene)}</b><br>${esc(m.direct)}<br><span class="muted">升级挑战：${esc(m.challenge)}</span></div><p class="hint">先出声回答30–60秒。可以用 iPhone 英文键盘听写，把说过的话留在下方；也可以只录音。</p><textarea class="textinput" id="speakText" lang="en-US" autocapitalize="sentences" placeholder="先开口说；用键盘 🎤 听写记录回答，或自己输入">${esc(text)}</textarea><div class="btnrow"><button class="btn main" data-act="focus-dictation">⌨ iPhone系统听写</button><button class="btn" data-act="show-speak-model">${reveal?'隐藏':'查看'}参考回答</button><button class="btn flat" data-act="try-recognition">实验性自动转文字</button></div><p id="recognitionStatus" class="status">Safari 自动识别可能卡住；系统英文键盘听写更稳定。</p>${reveal?`<div class="feedback"><b>参考表达（不是唯一正确答案）</b><br>${esc(m.target)}<div class="btnrow"><button class="btn flat" data-say="${esc(m.target)}">▶ 听示范</button></div><span class="muted">中日：${trans(m.l.d.find(x=>x[0]==='You')?.[2]||m.l.goal,m.l.d.find(x=>x[0]==='You')?.[3]||m.l.goal)}</span></div>`:''}${recorderPanel()}<div class="callout warning"><b>重要：自动评分不会假装理解语义</b>这个本地网页无法可靠判断你是否用正确语法、发音或逻辑回答。真正的纠错请使用下方AI教练。这里仅记录你已完成真实开口的练习。</div><button class="btn main wide" data-act="speak-finished">我已开口回答，并根据反馈重新说了一遍 ✓</button></div>`}
function reviewModule(m){let deck=currentDeck(),w=deck[0],reviewed=state.reviews[state.day]||[],todayWords=allWords.filter(x=>x.id.startsWith(m.l.id+'_')),completed=todayWords.every(w=>reviewed.includes(w.id));return `<div class="panel"><span class="kicker">04 / ACTIVE RECALL</span><h2>先回忆，再揭晓</h2><p class="hint">今天的新词5个，另有到期复习的旧词。只靠认出来不算掌握；尽量把词放进一句话。</p><div class="space"><span class="pill">已复习 ${reviewed.length} 张</span><span class="pill">到期旧词 ${dueWords().length} 个</span></div>${w?`<div class="wordcard" data-act="word-flip"><span class="kicker">${wordFlip?'ANSWER · 翻面后':'RECALL · 翻面前'}</span><div class="word">${esc(w.en)}</div>${wordFlip?`<div class="answer">${esc(w.zh)}</div><div class="muted">日：${esc(w.ja)}</div>`:'<div class="muted">用中文或日文说出意思，再用英文造句</div>'}</div><div class="btnrow"><button class="btn" data-say="${esc(w.en)}">▶ 发音</button><button class="btn main" data-act="word-flip">${wordFlip?'收起答案':'翻开答案'}</button></div>${wordFlip?`<div class="btnrow"><button class="btn bad" data-grade="again">忘了 · 明天再练</button><button class="btn" data-grade="hard">困难 · 2天后</button><button class="btn main" data-grade="good">记住 · 延迟复习</button></div>`:''}`:'<div class="feedback">✓ 今天所有词组均已复习。注意把词组用在真实对话中。</div>'}${completed?'<div class="feedback">✓ 今日新词回忆完成。</div>':''}</div>`}
function recorderPanel(){let playing=!!recUrl;return `<div class="rec-box" id="recBox"><div class="space"><strong>🎤 录音与回听（可选）</strong><span class="pill" id="recClock">${recStatus==='recording'?recSeconds+'秒':recStatus==='ready'?'录音就绪':'iPhone'}</span></div><div class="meter"><span id="recMeter" style="width:${Math.round(recLevel*100)}%"></span></div><p class="hint" id="recDetail">${esc(recDetail)}</p><div class="btnrow"><button class="btn ${recStatus==='recording'?'bad':'main'}" data-act="record-toggle">${recStatus==='recording'?'■ 结束录音':'● 开始录音'}</button><button class="btn flat" data-act="rec-guide">录不了？点这里</button></div>${playing?`<audio id="recAudio" src="${recUrl}" controls playsinline preload="metadata"></audio><div class="btnrow"><a class="btn" href="${recUrl}" download="Speak90-Day${state.day}.wav">保存本次录音</a></div>`:''}<div class="btnrow"><label class="btn" for="externalAudio">导入语音备忘录文件</label><input id="externalAudio" type="file" accept="audio/*" style="display:none"></div></div>`}
const skillNames={comprehension:'听力',fluency:'流利度',accuracy:'准确度',repair:'纠错重说'};
function aiPrompt(){let m=mission(),last=state.reports[state.day-1],old=state.errors.filter(e=>!e.resolved).slice(-4),baseline=state.baseline;let name=state.name||'Learner';let prompt=`你是我的 Speak90 私人英语口语教练。我是中文母语者，生活在日本，英语正在从零基础逐步提高。你必须严格按照下面的训练流程与我互动。\n\n【学习者】${name}\n【训练日】Day ${state.day}/90\n【今日主题】${m.l.topic} / ${m.l.en}\n【工作及生活场景】${m.l.scene}\n【目标任务】${m.direct}\n【难度阶段】${['基础模仿：适当给提示','场景迁移：改用我的真实信息','实战应对：加入追问和突发情况'][m.p]}\n【基础参考句】${m.target}\n【今天重点补强】${focusedSkill()}\n【上次薄弱点】${last?`理解${last.comprehension}/5，流利度${last.fluency}/5，语法${last.accuracy}/5，纠错重说${last.repair}/5`:'尚无评价'}\n【需复习的错误】${old.map(e=>e.bad+' → '+e.good).join('；')||'暂无'}\n${baseline?'【基线】'+baseline.note+'\n':''}\n\n【训练规则，务必遵守】\n1. 你扮演真实的对话对象，而不是讲课机器人。一次只说一句或只问一个问题；收到我的回答后再继续。\n2. 从简单句开始，依据我的表现提高或降低难度。前3轮每轮不超过15个英文单词。之后逐渐加入问原因、改变时间、异常处理等问题。\n3. 我有错误时，先确认是否理解，再给出最重要的1处纠错，要求我立刻重说。不要一次纠正超过2处。\n4. 不能仅凭关键词打分。评价要分别考虑听懂问题、流利程度、语法准确、纠错后能否重新表达；没听到语音就不要对口音评分。\n5. 继续至少8轮真实英语对话，至少安排2次旧错误复习、1次突然变化、1次没有准备的追问。根据我能力调整。\n6. 默认英语对话。只有我明确说“中文帮助”时用简短中文解释，必要时可附一行日文。\n7. 开始时不要展示参考答案；也不要一次输出整套对话。现在只问第1个英语问题，等我的回答。\n8. 当我说“结束本次训练并生成报告”时：分别给4项0–5分，列出最多3个具体的错误与正确表达，提出下次1个重点，并在结尾额外给出一行可复制机器报告（不要使用代码围栏）：\nSPEAK90_RESULT|day=${state.day}|comprehension=整数|fluency=整数|accuracy=整数|repair=整数|error1=错误表达 => 正确表达|error2=错误表达 => 正确表达|next=下一步建议\n报告必须根据真实互动评估，若证据不足要明确说明，不能捏造。\n\n现在进入角色，从简单英文开始，一次只问一个问题。`;
return prompt}
function coach(){const m=mission(),report=state.reports[state.day];return `${header('AI COACH · CONNECT TO CHATGPT','让AI成为你的私人英语教练。','使用 ChatGPT 的动态对话和纠错能力；本地网页不会擅自发送你的录音或个人资料。')}
<div class="panel"><span class="kicker">YOUR PERSONALIZED SESSION</span><h2>今天的实战对话：${esc(m.l.topic)}</h2><p class="scene">${esc(m.l.scene)}。${esc(m.challenge)}</p><p class="hint">系统根据你的学习日、过去报告和仍未纠正的错误生成专属教练提示。点击复制，到 ChatGPT 新对话粘贴，然后进入语音模式开口练习。</p><div class="btnrow"><button class="btn main" data-act="copy-coach">① 复制我的教练指令</button><button class="btn" data-act="open-chatgpt">② 打开 ChatGPT</button></div><div class="callout"><b>推荐操作（适合iPhone）</b>先复制指令 → 打开 ChatGPT 新对话粘贴发送 → 点击 ChatGPT 语音图标 → 至少对话8轮 → 结束时说“结束本次训练并生成报告” → 复制最后一行报告，回到本App导入。</div><div class="btnrow"><button class="btn flat" data-act="copy-weekly">复制本周口语测评任务</button></div></div>
<div class="panel"><span class="kicker">ADAPTIVE FEEDBACK / IMPORT REPORT</span><h2>把 AI 纠错带回 Speak90</h2><p class="hint">只粘贴 ChatGPT 回复末尾以 <code>SPEAK90_RESULT|</code> 开头的一行。导入后会跟踪4项指标，并把错误安排到复习。</p><textarea class="textinput" id="reportText" placeholder="SPEAK90_RESULT|day=${state.day}|comprehension=3|fluency=2|accuracy=3|repair=2|error1=I go yesterday => I went yesterday|next=加强过去时"></textarea><div class="btnrow"><button class="btn main" data-act="import-report">导入AI报告并更新弱点</button></div>${report?`<div class="feedback">✓ 今天已导入AI报告。最需要提高：${focusedSkill()}<br>听力${report.comprehension}/5 · 流利度${report.fluency}/5 · 语法${report.accuracy}/5 · 纠错${report.repair}/5</div>`:''}<p class="hint">没有内置AI API，不能自动读取ChatGPT另一段对话。此处需要手动复制粘贴一次；你的数据不会被上传至这个网页的服务器。</p></div>${footer()}`}
function weeklyPrompt(){let m=mission();return `请担任英语口语能力评估员，对我做一次独立、无预习的口语基线/周测。我的阶段是 Speak90 Day ${state.day}/90；主题 ${m.l.topic}。请从简单日常对话、信息确认、解释原因、临时变更、工作/旅行任务五个维度提问，一次只问一个英语问题，每次不超过15个词。至少进行8轮，不提供答案直到我回答。最后请说明我现在能独立完成什么、哪里容易失败；以证据评估听力理解/流利度/准确度/纠错重说，每项0-5分，并给出以后7天最重要的3个练习。请勿在未听到我的真实语音时声称评估发音。`;}
function scoreRows(){let reports=Object.values(state.reports);if(!reports.length)return '<div class="callout">还没有测评数据。完成一次ChatGPT口语对话，复制末尾的 SPEAK90_RESULT 报告回来，四项能力曲线就会逐渐形成。</div>';return Object.keys(skillNames).map(k=>{let scores=reports.map(r=>Number(r[k])).filter(Number.isFinite),n=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;return `<div class="skill"><span>${skillNames[k]}</span><div class="progressline"><span style="width:${clamp(n/5*100,0,100)}%"></span></div><span>${n.toFixed(1)}</span></div>`}).join('')}
function stats(){let reports=Object.entries(state.reports).sort((a,b)=>Number(a[0])-Number(b[0])),completion=fullDays(),recent=reports.slice(-8).reverse();return `${header('MEASURE REAL IMPROVEMENT','你的90天成长记录','完成次数、回忆效果和AI教练报告分开统计，避免用打卡数冒充英语水平。')}
<div class="metrics"><div class="metric"><strong>${completion}</strong><small>完成的训练日</small></div><div class="metric"><strong>${Object.keys(state.reports).length}</strong><small>有证据的AI报告</small></div><div class="metric"><strong>${state.errors.filter(e=>!e.resolved).length}</strong><small>待纠正错误</small></div></div>
<div class="panel"><div class="space"><h2 style="margin:0">四项能力追踪</h2><span class="pill">由ChatGPT报告提供</span></div>${scoreRows()}<div class="hint">评分是教练反馈趋势，不等同于IELTS、CEFR官方成绩；录音是否能被AI听到取决于实际使用方式。</div></div>
<div class="panel"><div class="space"><h2 style="margin:0">近期测评</h2><button class="btn flat" data-act="go-coach">开启一次测评</button></div>${recent.length?recent.map(([day,r])=>`<div class="week-row"><b>Day ${day}</b><div class="stats">听力 ${r.comprehension} · 流利度 ${r.fluency} · 语法 ${r.accuracy} · 纠错 ${r.repair}（各5分）</div><small class="muted">${esc(r.next||'')}</small></div>`).join(''):'<div class="hint">先做一次基线评估，以后每7天做相似题型的检测，才能比较进步。</div>'}</div>
<div class="panel"><h2>错误修复清单</h2><p class="hint">把ChatGPT指出的常见错误存为延迟复习卡。改对以后点击“我已能重说”。</p><div class="errors">${state.errors.filter(e=>!e.resolved).slice(-12).map((e,i)=>`<div class="error"><b>原句：${esc(e.bad)}</b><br><span>纠正：${esc(e.good)}</span><div class="btnrow"><button class="btn flat" data-fix="${e.id}">我已能重说 ✓</button></div></div>`).join('')||'<div class="hint">暂时没有导入的错误。</div>'}</div></div>
<div class="panel"><h2>我的设置及数据</h2><div class="field"><label>怎么称呼你（仅保存在本机）</label><input id="nameInput" value="${esc(state.name)}" placeholder="你的英文名字"></div><div class="field"><label>翻译显示</label><select id="langInput"><option value="both" ${state.lang==='both'?'selected':''}>中文 + 日文</option><option value="zh" ${state.lang==='zh'?'selected':''}>仅中文</option><option value="ja" ${state.lang==='ja'?'selected':''}>仅日文</option></select></div><div class="field"><label>英语朗读语速</label><select id="speedInput">${[['.70','0.70× 慢速'],['.85','0.85× 学习'],['1','1.00× 自然']].map(([v,l])=>`<option value="${v}" ${Math.abs(state.speed-Number(v))<.01?'selected':''}>${l}</option>`).join('')}</select></div><div class="btnrow"><button class="btn main" data-act="save-settings">保存设置</button><button class="btn" data-act="export">导出全部学习记录</button><label class="btn" for="importBackup">导入备份文件</label><input id="importBackup" type="file" accept="application/json,.json" style="display:none"></div>${state.oldImport?'<div class="callout">✓ 已发现旧版 Speak90 的本地记录，已继承训练日、已完成任务、词汇复习及语言设置。旧版数据没有被删除。</div>':''}<div class="hint">换设备或清除Safari网站数据会失去本地记录。每周建议导出一次JSON备份。此版本不会向GitHub上传学习记录。</div></div><div class="btnrow"><button class="btn flat" data-act="go-plan">查看全部90天课程</button></div>${footer()}`}
function plan(){return `${header('90 DAY CURRICULUM','90天完整训练地图','30个主题，每个主题依次训练输入模仿、场景迁移、突发情况实战；每7天安排独立口语测评。')}

function stopVoice(){try{window.speechSynthesis?.cancel()}catch(e){}ttsUtterance=null}
function say(text,rate=state.speed,onend){stopVoice();if(!('speechSynthesis'in window)){toast('此设备不支持系统英文朗读');return}const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1;u.volume=1;const vs=window.speechSynthesis.getVoices(),v=vs.find(x=>x.lang.toLowerCase().startsWith('en-us')&&x.localService)||vs.find(x=>x.lang.toLowerCase().startsWith('en-us'))||vs.find(x=>x.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;ttsUtterance=u;u.onend=()=>{if(ttsUtterance===u&&onend)onend()};u.onerror=()=>{if(ttsUtterance===u)toast('系统朗读失败，请检查设备音量或语音设置')};try{window.speechSynthesis.speak(u)}catch(e){toast('朗读无法启动')}}

function stopRecognition(){clearTimeout(recognitionWatch);try{recognition?.abort()}catch(e){}recognition=null}
function speechStatus(s){let el=$('#recognitionStatus');if(el)el.textContent=s}
function autoRecognition(){stopVoice();stopRecognition();let Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){speechStatus('Safari没有提供自动识别。请使用键盘听写或录音。');return};const rec=new Rec();recognition=rec;rec.lang='en-US';rec.interimResults=true;rec.continuous=false;let got=false;recognitionWatch=setTimeout(()=>{if(recognition!==rec)return;stopRecognition();speechStatus('12秒内没有识别文字，已自动停止。请改用iPhone英文键盘 🎤 听写。')},12000);rec.onresult=e=>{let t=[...e.results].map(x=>x[0]?.transcript||'').join(' ').trim();if(t){got=true;const f=$('#speakText');if(f){f.value=t;state.notes[state.day]??={};state.notes[state.day].speak=t;save()}speechStatus('已识别：'+t)}if(e.results[e.results.length-1]?.isFinal)stopRecognition()};rec.onerror=e=>{stopRecognition();speechStatus('识别失败：'+(e.error||'未知错误')+'。建议切换系统听写。')};rec.onend=()=>{if(recognition===rec){stopRecognition();if(!got)speechStatus('识别没有返回文字。建议使用iPhone系统听写。')}};try{rec.start();speechStatus('正在监听……说一句简单英文；若12秒没有文字将自动停止。')}catch(e){stopRecognition();speechStatus('无法启动语音识别：'+e.message)}}
const recDom=()=>$('#recBox');
function recUpdate(){let el=$('#recDetail');if(el)el.textContent=recDetail;let met=$('#recMeter');if(met)met.style.width=Math.round(recLevel*100)+'%';let c=$('#recClock');if(c)c.textContent=recStatus==='recording'?recSeconds+'秒':recStatus==='ready'?'录音就绪':recStatus==='requesting'?'授权中':'iPhone'}
function recMessage(msg,status){recDetail=msg;if(status)recStatus=status;recUpdate()}
function disposeSession(session){try{session?.processor?.disconnect()}catch(e){}try{session?.source?.disconnect()}catch(e){}try{session?.sink?.disconnect()}catch(e){}try{session?.stream?.getTracks().forEach(t=>t.stop())}catch(e){}try{session?.context?.close()}catch(e){}try{session?.media?.stop()}catch(e){}clearInterval(recPulse);recPulse=null}
function wavData(chunks,sr){let len=chunks.reduce((s,x)=>s+x.length,0),ab=new ArrayBuffer(44+len*2),dv=new DataView(ab);function word(offset,text){for(let i=0;i<text.length;i++)dv.setUint8(offset+i,text.charCodeAt(i))};word(0,'RIFF');dv.setUint32(4,36+len*2,true);word(8,'WAVE');word(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);word(36,'data');dv.setUint32(40,len*2,true);let off=44;for(let ch of chunks)for(let i=0;i<ch.length;i++){let v=clamp(ch[i],-1,1);dv.setInt16(off,v<0?v*32768:v*32767,true);off+=2}return new Blob([ab],{type:'audio/wav'})}
function showRecording(blob){if(recUrl)URL.revokeObjectURL(recUrl);recBlob=blob;recUrl=URL.createObjectURL(blob);recLevel=0;recStatus='ready';recDetail=`录音成功（${Math.round(blob.size/1024)} KB）。点击下方播放器听回放。只保存在当前页面，不自动上传。`;render();}
async function startRecorder(){if(recStatus==='recording')return;stopVoice();stopRecognition();if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){recMessage('网页不支持安全麦克风权限。请在Safari的HTTPS网站访问，或用语音备忘录录制后导入。','error');return}recStatus='requesting';recMessage('等待麦克风授权……');let sess={chunks:[],sampleRate:44100};recSession=sess;try{sess.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});if(recSession!==sess){disposeSession(sess);return}let AC=window.AudioContext||window.webkitAudioContext;if(AC){sess.context=new AC();await sess.context.resume();sess.sampleRate=sess.context.sampleRate;if(sess.context.createScriptProcessor){sess.source=sess.context.createMediaStreamSource(sess.stream);sess.processor=sess.context.createScriptProcessor(4096,1,1);sess.sink=sess.context.createGain();sess.sink.gain.value=0;sess.source.connect(sess.processor);sess.processor.connect(sess.sink);sess.sink.connect(sess.context.destination);sess.processor.onaudioprocess=e=>{if(recSession!==sess||recStatus!=='recording')return;const a=e.inputBuffer.getChannelData(0);let copy=new Float32Array(a.length);copy.set(a);sess.chunks.push(copy);let ss=0;for(let i=0;i<a.length;i+=16)ss+=a[i]*a[i];recLevel=clamp(Math.sqrt(ss/(a.length/16))*8,0,1);const el=$('#recMeter');if(el)el.style.width=Math.round(recLevel*100)+'%';};}else startMediaFallback(sess)}else startMediaFallback(sess);recStatus='recording';recSeconds=0;recMessage('开始录音。对手机说一句英文，观察音量条。最长90秒。');const started=Date.now();recPulse=setInterval(()=>{recSeconds=Math.floor((Date.now()-started)/1000);recUpdate();if(recSeconds>=90)stopRecorder()},300)}catch(e){if(recSession===sess){recSession=null;disposeSession(sess)}let message=e?.name==='NotAllowedError'?'麦克风被拒绝。打开Safari的网站设置，允许麦克风，再刷新页面。':e?.name==='NotFoundError'?'没有找到可用麦克风。':e?.name==='NotReadableError'?'麦克风被其他应用占用，请关闭通话/录音应用重试。':'无法录音：'+(e.message||e.name);recMessage(message+' 你仍可导入语音备忘录。','error')}}
function stopRecorder(){const sess=recSession;if(!sess)return;recSession=null;if(sess.media){try{sess.media.stop()}catch(e){recMessage('录音无法停止：'+e.message,'error')}try{sess.stream?.getTracks().forEach(t=>t.stop())}catch(e){}clearInterval(recPulse);recPulse=null;return}disposeSession(sess);if(!sess.chunks.length){recMessage('没有录到有效音频数据；请使用iPhone语音备忘录录制后导入。','error');return}try{let wav=wavData(sess.chunks,sess.sampleRate);showRecording(wav)}catch(e){recMessage('制作录音文件失败：'+e.message,'error')}}
function startMediaFallback(sess){if(!window.MediaRecorder)throw Error('该浏览器没有支持的录音引擎');try{sess.context?.close()}catch(e){}sess.context=null;const types=['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'];const typ=types.find(t=>{try{return MediaRecorder.isTypeSupported(t)}catch(e){return false}});const media=new MediaRecorder(sess.stream,typ?{mimeType:typ}:undefined);sess.media=media;sess.blobs=[];media.ondataavailable=e=>{if(e.data?.size)sess.blobs.push(e.data)};media.onerror=e=>recMessage('音频编码器异常。请使用语音备忘录。','error');media.onstop=()=>{if(!sess.blobs.length){recMessage('浏览器没有输出录音文件，请使用语音备忘录。','error');return}showRecording(new Blob(sess.blobs,{type:media.mimeType||'audio/mp4'}))};media.start(500);recDetail='正在录音（备用音频编码器）。如果回放失败，请使用语音备忘录。'}
function startTimer(){if(trainingStarted){let min=(Date.now()-trainingStarted)/60000;state.minutes[state.day]=(state.minutes[state.day]||0)+Math.max(0,min);save();trainingStarted=null;clearInterval(trainingTimer);toast('已停止学习计时')}else{trainingStarted=Date.now();trainingTimer=setInterval(()=>{const e=$('.topline button');if(e)e.textContent='◷ 计时中 · '+Math.round((state.minutes[state.day]||0)+(Date.now()-trainingStarted)/60000)+'分';save()},15000);toast('计时已开始，专注练习')}render()}

async function copyText(text){try{await navigator.clipboard.writeText(text);toast('已复制到剪贴板')}catch(e){let ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();if(ok)toast('已复制到剪贴板');else{toast('复制失败：可长按下面的文本手动复制');modal=text}}}
function reportImport(raw){let line=(raw||'').split(/\n/).find(x=>x.includes('SPEAK90_RESULT|'))||raw;let start=line.indexOf('SPEAK90_RESULT|');if(start<0)return '请粘贴以 SPEAK90_RESULT| 开头的一整行报告';line=line.slice(start).replace(/[`*]/g,'').trim();let obj={};for(const part of line.split('|').slice(1)){let i=part.indexOf('=');if(i>0)obj[part.slice(0,i).trim().toLowerCase()]=part.slice(i+1).trim()}
let day=Number(obj.day);if(!Number.isInteger(day)||day<1||day>90)return '报告中的 day 必须在1～90之间';let vals={};for(const k of Object.keys(skillNames)){let v=Number(obj[k]);if(!Number.isFinite(v)||v<0||v>5||!obj[k])return `缺少 ${k} 的0～5评分`;vals[k]=v}state.reports[day]={...vals,next:(obj.next||'').slice(0,250),added:Date.now()};for(let i=1;i<=3;i++){let pair=obj['error'+i];if(!pair)continue;let parts=pair.split(/\s*=>\s*/);if(parts.length!==2)continue;let bad=parts[0].trim().slice(0,160),good=parts[1].trim().slice(0,180);if(bad&&good&&!state.errors.some(e=>e.bad===bad&&e.good===good))state.errors.push({id:Date.now()+'_'+i,bad,good,day,resolved:false})}state.done[day]??={};state.done[day].ai=true;save();render();return ''}
function saveGrade(level){let w=currentDeck()[0];if(!w)return;let s=state.srs[w.id]||{interval:0,ease:2.3};let days;if(level==='again'){days=1;s.ease=Math.max(1.35,s.ease-.22)}else if(level==='hard'){days=2;s.ease=Math.max(1.35,s.ease-.13)}else{days=s.interval?clamp(Math.round(s.interval*s.ease),3,90):4;s.ease=Math.min(3.1,s.ease+.06)}s.interval=days;s.due=new Date(Date.now()+days*86400000).toISOString().slice(0,10);s.last=cnDay();state.srs[w.id]=s;state.reviews[state.day]??=[];state.reviews[state.day].push(w.id);wordFlip=false;const fresh=allWords.filter(x=>x.id.startsWith(mission().l.id+'_'));if(fresh.every(x=>state.reviews[state.day].includes(x.id)))mark('review');else{save();render()}}
function safeRestore(raw){try{let j=JSON.parse(raw);const legacy=j&&j.version!==2&&Number.isInteger(j.day)&&j.done&&j.srs&&(j.dayReviews||j.translation);if(legacy){const upgraded=defaultState();upgraded.day=clamp(j.day,1,90);upgraded.lang=j.translation||'both';upgraded.speed=Number(j.speed||.85);for(const [d,tasks] of Object.entries(j.done||{}))upgraded.done[d]={listen:!!tasks.listen,shadow:!!tasks.shadow,speak:!!tasks.speak,review:!!tasks.words,ai:false};upgraded.reviews=j.dayReviews||{};upgraded.srs=j.srs||{};upgraded.oldImport={day:j.day,completedOld:Object.keys(j.done||{}).length,fromFile:true};j=upgraded;}if(j.version!==2||!j.done||!j.srs||!j.reports||!Number.isInteger(j.day)||j.day<1||j.day>90)throw Error('文件不是有效的Speak90备份');if(!confirm('导入备份会覆盖这台设备当前的 Speak90 学习记录。确定继续？'))return;state={...defaultState(),...j};save();render();toast(legacy?'旧版学习备份迁移成功':'学习数据恢复成功')}catch(e){toast('导入失败：'+e.message)}}
function download(text,name,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function act(a,el){switch(a){case 'advance-day':advanceDay();break;case 'start-training':mode='listen';switchTab('training');break;case 'go-training':mode=el.dataset.mode||'listen';switchTab('training');break;case 'go-home':switchTab('home');break;case 'go-coach':switchTab('coach');break;case 'go-plan':switchTab('plan');break;case 'go-stats':switchTab('stats');break;case 'timer':startTimer();break;case 'play-dialogue':playDialogue(state.speed);break;case 'play-slow':playDialogue(.75);break;case 'stop-tts':stopVoice();break;case 'toggle-script':reveal=!reveal;render();break;case 'check-listen':if(choice===null){toast('请先选择一个答案');return}state.answers[state.day]??={};state.answers[state.day].listen=choice===mission().l.q[2];if(state.answers[state.day].listen)mark('listen');else{save();render()}break;case 'play-target':say(mission().target);break;case 'play-target-slow':say(mission().target,.7);break;case 'shadow-rep':state.shadowCount[state.day]=(state.shadowCount[state.day]||0)+1;if(state.shadowCount[state.day]===3)mark('shadow');else{save();render()}break;case 'focus-dictation':{let t=$('#speakText');t?.focus();toast('切换英文键盘，点键盘上的🎤说话');break}case 'show-speak-model':reveal=!reveal;render();break;case 'try-recognition':autoRecognition();break;case 'speak-finished':{const t=$('#speakText');state.notes[state.day]??={};if(t)state.notes[state.day].speak=t.value.slice(0,1000);mark('speak');break}case 'word-flip':wordFlip=!wordFlip;render();break;case 'record-toggle':if(recStatus==='recording')stopRecorder();else startRecorder();break;case 'rec-guide':alert('网页录音需要：①Safari浏览器 ②https网站 ③允许麦克风。若仍失败：打开iPhone「语音备忘录」录制，点分享→存储到文件，然后回到本页用「导入语音备忘录文件」试听。\n\n自动转文字与录音是两套功能，不能互相代替。');break;case 'copy-coach':copyText(aiPrompt());break;case 'open-chatgpt':window.open('https://chatgpt.com/','_blank','noopener,noreferrer');break;case 'copy-weekly':copyText(weeklyPrompt());break;case 'import-report':{let error=reportImport($('#reportText')?.value||'');if(error)toast(error);else toast('✓ 报告已导
