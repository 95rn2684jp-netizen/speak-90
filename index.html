function showToast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2900)}
function stopSpeech(){try{window.speechSynthesis.cancel()}catch{}speechTask=null}
function say(text,rate=state.speed,cb){if(!('speechSynthesis'in window)){showToast('此浏览器不支持英文朗读');return}stopSpeech();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1;u.volume=1;const voices=window.speechSynthesis.getVoices(),en=voices.find(v=>v.lang.toLowerCase().startsWith('en-us')&&v.localService)||voices.find(v=>v.lang.toLowerCase().startsWith('en-us'))||voices.find(v=>v.lang.toLowerCase().startsWith('en'));if(en)u.voice=en;u.onend=()=>{if(speechTask===u&&cb)cb()};u.onerror=()=>{if(speechTask===u)showToast('语音朗读失败，请检查静音模式或系统语音设置')};speechTask=u;window.speechSynthesis.speak(u)}
function dialoguePlay(rate){const lines=lesson().d.map(x=>x[1]);let i=0;const play=()=>{if(i<lines.length)say(lines[i++],rate,play)};play()}
function clean(s){return String(s||'').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function similarity(a,b){let x=clean(a),y=clean(b);if(!x&&!y)return 1;if(!x||!y)return 0;const prev=Array.from({length:y.length+1},(_,i)=>i);for(let i=1;i<=x.length;i++){let up=prev[0];prev[0]=i;for(let j=1;j<=y.length;j++){let old=prev[j];prev[j]=Math.min(prev[j]+1,prev[j-1]+1,up+(x[i-1]===y[j-1]?0:1));up=old}}return Math.max(0,1-prev[y.length]/Math.max(x.length,y.length))}
function markTask(k){state.done[state.day]??={};if(!state.done[state.day][k]){state.done[state.day][k]=true;save();showToast('✓ 已完成今日'+({listen:'听力',shadow:'跟读',speak:'开口',words:'复习'}[k]||k)+'任务')}}
function evaluate(text,groups){let s=clean(text),hit=groups.filter(g=>g.some(k=>s.includes(clean(k)))).length;return {hit,total:groups.length,pct:hit/groups.length}}
function recognized(text,mode){state.voiceAttempts++;save();if(mode==='shadow'){shadowResult={input:text,source:'voice'};if(similarity(text,dailyTarget().target)>=.6)markTask('shadow');render();showToast('已取得语音识别文本')}else if(mode==='daily'){const t=$('#dailySpeakText');if(t)t.value=text;showToast('已识别 · 可检查回答')}else if(mode==='role'){const t=$('#roleSpeakText');if(t)t.value=text;showToast('已识别 · 可提交回答')}else if(mode==='news'){const t=$('#newsSummary');if(t)t.value=(t.value?t.value+' ':'')+text;showToast('已识别英文总结')}}
function stopRecognition(){if(recognition){try{recognition.abort()}catch{}recognition=null}}
function recognize(mode){const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Rec){showToast('此浏览器不支持网页语音识别；可使用 iPhone 键盘的听写功能');return}stopRecognition();stopSpeech();try{const rec=new Rec();recognition=rec;rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=1;rec.continuous=false;rec.onstart=()=>showToast('请开始说英语…');rec.onresult=e=>{const t=e.results[0][0].transcript;recognized(t,mode)};rec.onerror=e=>showToast(e.error==='not-allowed'?'无法使用麦克风：请允许浏览器的麦克风权限':`语音识别未完成：${e.error}`);rec.onend=()=>{if(recognition===rec)recognition=null};rec.start()}catch(e){showToast('无法启动语音识别：请在 HTTPS 浏览器中打开')}}
async function toggleRecording(){if(recorder?.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){showToast('当前浏览器暂不支持网页录音，请使用系统语音备忘录');return}try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});let type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(mediaStream,type?{mimeType:type}:undefined);let chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:type||'audio/mp4'});if(recordingURL)URL.revokeObjectURL(recordingURL);recordingURL=URL.createObjectURL(blob);mediaStream.getTracks().forEach(t=>t.stop());mediaStream=null;state.voiceAttempts++;save();const parent=$('#audioPlayback');if(parent)parent.innerHTML=`<audio controls preload="metadata" src="${recordingURL}"></audio><div class="muted-note">录音仅供本页回听，刷新后不会保留。</div>`;document.querySelectorAll('[data-action="record-audio"]').forEach(b=>{b.classList.remove('recording');b.textContent='● 录音回听'});showToast('录音完成，可以回听')};recorder.start();document.querySelectorAll('[data-action="record-audio"]').forEach(b=>{b.classList.add('recording');b.textContent='■ 结束录音'});showToast('正在录音，再次点击结束')}catch{showToast('录音失败，请允许麦克风权限，并使用 HTTPS 页面')}}
function gradeWord(level){let w=getDeck()[0];if(!w)return;const current=state.srs[w.id]||{interval:0,ease:2.5,seen:0};let days;if(level==='again'){days=1;current.ease=Math.max(1.3,current.ease-.2)}else if(level==='hard'){days=2;current.ease=Math.max(1.3,current.ease-.15)}else if(level==='good'){days=current.interval===0?3:Math.max(3,Math.round(current.interval*current.ease))}else{days=current.interval===0?5:Math.max(5,Math.round(current.interval*current.ease*1.3));current.ease=Math.min(3.2,current.ease+.1)}current.interval=days;current.seen++;current.last=TODAY();const due=new Date(Date.now()+days*86400000);current.due=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(due);state.srs[w.id]=current;state.dayReviews[state.day]??=[];state.dayReviews[state.day].push(w.id);if(wordOfLesson().every(k=>state.dayReviews[state.day].includes(k.id)))markTask('words');showFlip=false;save();render()}

function exportData(){const blob=new Blob([JSON.stringify({app:'Speak90',version:1,exported:new Date().toISOString(),state},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Speak90_backup_'+TODAY()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);showToast('已生成本机学习记录备份')}
function importData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='Speak90'||!obj.state||!Number.isInteger(obj.state.day)||obj.state.day<1||obj.state.day>90)throw Error('Invalid');if(!confirm('导入会覆盖此设备当前的学习记录，确定继续？'))return;state={...defaultState(),...obj.state};save();switchTab('me');showToast('学习记录已导入')}catch{showToast('这不是有效的 Speak90 备份文件')}};reader.readAsText(file)}
function settings(){const html=`<div class="dialog-backdrop" id="settingsBackdrop"><div class="dialog-card" role="dialog" aria-modal="true" aria-label="设置"><div class="flex between"><div><div class="kicker">APP PREFERENCES</div><h2>学习设置</h2></div><button class="round-btn" data-action="close-settings" aria-label="关闭">×</button></div><label for="transSetting">解释语言</label><select class="select" id="transSetting"><option value="both" ${state.translation==='both'?'selected':''}>中文 + 日语</option><option value="zh" ${state.translation==='zh'?'selected':''}>仅中文</option><option value="ja" ${state.translation==='ja'?'selected':''}>仅日语</option></select><label for="speedSetting">语音朗读速度</label><select class="select" id="speedSetting"><option value="0.75" ${state.speed===.75?'selected':''}>0.75× · 初学慢速</option><option value="0.86" ${state.speed===.86?'selected':''}>0.86× · 推荐</option><option value="1" ${state.speed===1?'selected':''}>1.0× · 日常自然语速</option><option value="1.14" ${state.speed===1.14?'selected':''}>1.14× · 听力挑战</option></select><p class="muted-note" style="margin-top:20px">课程、词库和学习进度在当前浏览器离线使用。不要清除网站数据，否则会丢失进度。语音识别可能由浏览器或云服务处理音频。</p><div class="flex wrap" style="margin-top:21px"><button class="btn full" data-action="save-settings">保存设置</button><button class="btn danger full" data-action="reset-all">清空全部学习记录</button></div></div></div>`;$('#dialog').innerHTML=html}
function closeSettings(){$('#dialog').innerHTML=''}
const clipboard=async s=>{try{await navigator.clipboard.writeText(s);showToast('已复制，请粘贴到 ChatGPT')}catch{const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();showToast('已复制学习提示词')}};
document.addEventListener('click',async e=>{let el=e.target.closest('[data-tab],[data-action],[data-choice],[data-grade],[data-filter],[data-scene],[data-say],[data-news-open]');if(!el)return;if(el.dataset.tab){switchTab(el.dataset.tab);return}if(el.dataset.say){say(el.dataset.say);return}if('choice'in el.dataset){listenAnswer=Number(el.dataset.choice);if(listenAnswer===lesson().q[2])markTask('listen');render();return}if(el.dataset.grade){gradeWord(el.dataset.grade);return}if(el.dataset.filter){wordFilter=el.dataset.filter;render();return}if(el.dataset.scene){beginScene(Number(el.dataset.scene));return}if(el.dataset.newsOpen){currentNews=Number(el.dataset.newsOpen);newsSource=state.news[currentNews].text;newsSummary='';render();return}
switch(el.dataset.action){case 'open-settings':settings();break;case 'close-settings':closeSettings();break;case 'save-settings':state.translation=$('#transSetting').value;state.speed=Number($('#speedSetting').value);save();closeSettings();render();showToast('设置已保存');break;case 'reset-all':if(confirm('确定删除全部学习进度、词卡记录和保存的新闻？此操作无法撤销。')){state=defaultState();save();closeSettings();switchTab('home');showToast('学习记录已清空')}break;case 'next-day':nextDay();break;case 'play-dialogue':dialoguePlay(state.speed);break;case 'slow-dialogue':dialoguePlay(.75);break;case 'toggle-script':showScript=!showScript;render();break;case 'recognize-shadow':recognize('shadow');break;case 'mark-shadow':markTask('shadow');render();break;case 'record-audio':toggleRecording();break;case 'check-shadow':{const t=$('#shadowText').value.trim();if(!t){showToast('请先输入英文内容');break}shadowResult={input:t,source:'typed'};state.textAttempts++;save();render();break}case 'flip':showFlip=!showFlip;render();break;case 'daily-mic':recognize('daily');break;case 'daily-check':dailyCheck();break;case 'daily-example':$('#dailyExample').hidden=!$('#dailyExample').hidden;break;case 'role-mic':recognize('role');break;case 'role-submit':roleSubmit();break;case 'role-hint':{const t=PRACTICE_SCENES[currentScene].turns[sceneTurn];showToast('参考：'+t.sample);say(t.sample);break}case 'role-next':roleNext();break;case 'scene-restart':beginScene(currentScene);break;case 'open-news':newsSource='';newsSummary='';switchTab('news');break;case 'news-analyze':newsAnalyze();break;case 'news-read':newsSync();say(newsSource.slice(0,1300));break;case 'news-slow':newsSync();say(newsSource.slice(0,1300),.75);break;case 'news-save':newsSync();if(!newsSource.trim()){showToast('请先输入新闻正文');break}state.news.unshift({text:newsSource.trim(),date:TODAY()});state.news=state.news.slice(0,10);save();showToast('新闻材料已保存');render();break;case 'news-clear':newsSource='';newsSummary='';render();break;case 'news-mic':recognize('news');break;case 'news-prompt':{newsSync();if(!newsSummary.trim()){showToast('请先写下英文总结');break}clipboard('你是一位中英文双语的英语口语教练。我目前从零开始学习，目标是能在旅行和国际物流工作中交流。下面是我阅读的英文新闻：\n'+newsSource+'\n\n这是我的英文总结：\n'+newsSummary+'\n\n请：1. 检查我总结的意思有没有偏差；2. 改正语法并逐处说明，给中日双语解释；3. 提供自然但适合A1-B1的口头表达版本；4. 提取5个最值得学习的专业词并给例句；5. 用英文向我追问3个适合口头回答的问题，一次只问一个。');break}case 'play-free-prompt':say('Please introduce yourself, describe your work, and explain one problem you solved recently.',.86);break;case 'ai-coach':{const t=dailyTarget(),l=lesson();clipboard('你是我的英语实战口语教练。我是从零开始学英语的中国人在日本工作，希望能流利处理旅行、生活和物流工作的英文交流。请直接进入英文语音角色扮演，一次只问一句英语，等我回答再继续。\n主题：'+l.en+'\n场景：'+l.scene+'\n今天的目标：'+t.goal+'\n我的参考能力：'+t.target+'\n请遵守：先用慢速A1英语开场；每轮不要超过2句话；先让我回答，之后用中文和日语简短纠错，再给更自然的英文表达；根据我的水平逐渐增加难度；完成5轮后告诉我3个最应该复习的表达。不要一下子给出全部答案。');break}case 'export':exportData();break;case 'import':$('#importFile')?.click();break;}}
);
document.addEventListener('change',e=>{if(e.target.id==='importFile')importData(e.target.files[0])});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.flashcard')){e.preventDefault();showFlip=!showFlip;render()}});
document.getElementById('settingsBtn').addEventListener('click',settings);
window.addEventListener('online',()=>$('#networkIndicator').textContent='● 学习已就绪');window.addEventListener('offline',()=>$('#networkIndicator').textContent='● 离线模式');
if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script></body></html>
