<script>
const DATA={"lessons":[{"day":1,"group":"起步","title":"自我介绍","ask":"What's your name?","reply":"My name is Alex.","follow":"Nice to meet you. Where are you from?","questionZh":"你叫什么名字？","prompt":"请用英语介绍自己的名字。","g":"be","phase":"基础"},{"day":2,"group":"起步","title":"来自哪里","ask":"Where are you from?","reply":"I'm from China, but I live in Japan.","follow":"How long have you lived there?","questionZh":"你来自哪里？","prompt":"请说你的出生国家和现居国家。","g":"from","phase":"基础"},{"day":3,"group":"起步","title":"工作介绍","ask":"What do you do?","reply":"I work in logistics.","follow":"What do you do at work?","questionZh":"你从事什么工作？","prompt":"请告诉新朋友你的工作。","g":"simple","phase":"基础"},{"day":4,"group":"起步","title":"日常问候","ask":"How are you today?","reply":"I'm good, thanks. How about you?","follow":"I'm doing well, too.","questionZh":"你今天怎么样？","prompt":"请自然地回应问候，并反问对方。","g":"greeting","phase":"基础"},{"day":5,"group":"起步","title":"请求帮助","ask":"Can you help me, please?","reply":"Sure. What do you need?","follow":"I need some directions.","questionZh":"可以帮我吗？","prompt":"请礼貌地请求帮助。","g":"can","phase":"基础"},{"day":6,"group":"起步","title":"没听清","ask":"Could you say that again, please?","reply":"Of course. I'll speak more slowly.","follow":"Thanks. I understand now.","questionZh":"可以再说一遍吗？","prompt":"你没听清对方，请要求对方再说一遍。","g":"could","phase":"基础"},{"day":7,"group":"起步","title":"简单数字","ask":"How many packages do you have?","reply":"I have three packages.","follow":"Are they all the same size?","questionZh":"你有多少个包裹？","prompt":"请说你有三个包裹。","g":"plural","phase":"基础"},{"day":8,"group":"起步","title":"时间确认","ask":"What time is the meeting?","reply":"It's at nine thirty.","follow":"Should I arrive early?","questionZh":"会议几点开始？","prompt":"请回答会议在九点半。","g":"time","phase":"基础"},{"day":9,"group":"起步","title":"地点说明","ask":"Where is the station?","reply":"It's next to the bank.","follow":"Is it far from here?","questionZh":"车站在哪里？","prompt":"请说明车站在银行旁边。","g":"place","phase":"基础"},{"day":10,"group":"生活","title":"点咖啡","ask":"What would you like to drink?","reply":"I'd like a small latte, please.","follow":"For here or to go?","questionZh":"您想喝什么？","prompt":"请点一杯小杯拿铁。","g":"would","phase":"基础"},{"day":11,"group":"生活","title":"堂食外带","ask":"Is that for here or to go?","reply":"To go, please.","follow":"Would you like a bag?","questionZh":"堂食还是外带？","prompt":"请告诉店员你要外带。","g":"shortanswers","phase":"基础"},{"day":12,"group":"生活","title":"确认价格","ask":"How much is this?","reply":"It's eight dollars.","follow":"Would you like to pay by card?","questionZh":"这个多少钱？","prompt":"请询问一件商品的价格。","g":"howmuch","phase":"基础"},{"day":13,"group":"生活","title":"购物尺码","ask":"Do you have this in a larger size?","reply":"Yes, here's a medium.","follow":"Can I try it on?","questionZh":"有更大尺码吗？","prompt":"请询问是否有更大的尺寸。","g":"thisthat","phase":"基础"},{"day":14,"group":"生活","title":"付款方式","ask":"Can I pay by card?","reply":"Yes, we accept cards.","follow":"Would you like a receipt?","questionZh":"可以刷卡支付吗？","prompt":"请询问是否可以刷卡。","g":"can","phase":"基础"},{"day":15,"group":"生活","title":"索取收据","ask":"Would you like a receipt?","reply":"Yes, please. I need a receipt.","follow":"Would you like it by email?","questionZh":"需要收据吗？","prompt":"请明确表示需要收据。","g":"need","phase":"基础"},{"day":16,"group":"生活","title":"迷路问路","ask":"Excuse me, how do I get to the station?","reply":"Go straight and turn left.","follow":"Is it near the traffic light?","questionZh":"请问怎么去车站？","prompt":"请向路人询问去车站的方向。","g":"direction","phase":"基础"},{"day":17,"group":"生活","title":"乘车路线","ask":"Does this train go to the airport?","reply":"Yes, but you need to change at Namba.","follow":"Which platform should I use?","questionZh":"这辆列车去机场吗？","prompt":"请确认列车是否到机场。","g":"does","phase":"基础"},{"day":18,"group":"生活","title":"交通时间","ask":"How long does it take to get there?","reply":"It takes about forty minutes.","follow":"Is that including the transfer?","questionZh":"到那里需要多久？","prompt":"请说明大约四十分钟。","g":"takes","phase":"基础"},{"day":19,"group":"旅行","title":"机场值机","ask":"May I see your passport?","reply":"Here is my passport.","follow":"Do you have any bags to check?","questionZh":"能看一下护照吗？","prompt":"递交护照并回应柜台人员。","g":"here","phase":"基础"},{"day":20,"group":"旅行","title":"托运行李","ask":"How many bags are you checking?","reply":"I'm checking one suitcase.","follow":"Did you pack it yourself?","questionZh":"你要托运几个行李？","prompt":"请说明托运一个行李箱。","g":"presentcont","phase":"基础"},{"day":21,"group":"旅行","title":"登机口变化","ask":"Your gate has changed to gate twelve.","reply":"Thank you. Where is gate twelve?","follow":"It's near the food court.","questionZh":"登机口改成12号了。","prompt":"请确认新的登机口在哪里。","g":"where","phase":"基础"},{"day":22,"group":"旅行","title":"航班延误","ask":"Your flight is delayed by two hours.","reply":"Do you know the new departure time?","follow":"It should leave at six.","questionZh":"你的航班晚点两小时。","prompt":"请询问新的出发时间。","g":"future","phase":"基础"},{"day":23,"group":"旅行","title":"酒店办理入住","ask":"Do you have a reservation?","reply":"Yes, I have a reservation under Alex.","follow":"May I see your ID?","questionZh":"您预订了吗？","prompt":"请报出你的预订姓名。","g":"have","phase":"基础"},{"day":24,"group":"旅行","title":"房间问题","ask":"Is everything okay with your room?","reply":"The air conditioner isn't working.","follow":"I'll send someone to check it.","questionZh":"房间一切正常吗？","prompt":"请告诉前台空调不能用。","g":"negative","phase":"基础"},{"day":25,"group":"旅行","title":"餐厅预订","ask":"Do you have a table for two?","reply":"Yes, we have one by the window.","follow":"Could we sit there?","questionZh":"有两人桌吗？","prompt":"请询问有没有两人桌。","g":"fora","phase":"基础"},{"day":26,"group":"旅行","title":"行程建议","ask":"What would you recommend visiting?","reply":"I'd recommend the old town.","follow":"How do I get there?","questionZh":"推荐去哪里参观？","prompt":"请向当地人询问推荐景点。","g":"recommend","phase":"基础"},{"day":27,"group":"社交","title":"周末安排","ask":"What do you usually do on weekends?","reply":"I usually go for a walk or cook at home.","follow":"What do you like cooking?","questionZh":"周末通常做什么？","prompt":"请描述你周末通常做的两件事。","g":"frequency","phase":"基础"},{"day":28,"group":"社交","title":"兴趣爱好","ask":"What do you enjoy doing in your free time?","reply":"I enjoy taking photos and watching movies.","follow":"What kind of movies do you like?","questionZh":"空闲时喜欢做什么？","prompt":"请说出你的两个爱好。","g":"gerund","phase":"日常沟通"},{"day":29,"group":"社交","title":"分享昨天","ask":"What did you do yesterday?","reply":"I went shopping and had dinner with friends.","follow":"Where did you eat?","questionZh":"昨天做了什么？","prompt":"请用过去时说你昨天做了什么。","g":"past","phase":"日常沟通"},{"day":30,"group":"社交","title":"谈论明天","ask":"What are you doing tomorrow?","reply":"I'm meeting a friend after work.","follow":"Where are you meeting?","questionZh":"明天有什么安排？","prompt":"请说明你明天的一个计划。","g":"arrangements","phase":"日常沟通"},{"day":31,"group":"社交","title":"表达喜好","ask":"Do you prefer tea or coffee?","reply":"I prefer coffee because it helps me wake up.","follow":"Do you drink it every day?","questionZh":"喜欢茶还是咖啡？","prompt":"请说明你的选择并给出原因。","g":"because","phase":"日常沟通"},{"day":32,"group":"社交","title":"表达观点","ask":"What do you think of this movie?","reply":"I think it's interesting, but a little long.","follow":"Would you watch it again?","questionZh":"你觉得这部电影如何？","prompt":"请表达看法并增加一个转折。","g":"but","phase":"日常沟通"},{"day":33,"group":"社交","title":"礼貌拒绝","ask":"Would you like to join us tonight?","reply":"Thanks for inviting me, but I already have plans.","follow":"Maybe next time?","questionZh":"今晚一起来吗？","prompt":"请礼貌地拒绝一个邀请。","g":"politerefusal","phase":"日常沟通"},{"day":34,"group":"社交","title":"约定时间","ask":"When are you available this week?","reply":"I'm free on Thursday evening.","follow":"Does seven work for you?","questionZh":"本周什么时候有空？","prompt":"请提出周四晚上的时间。","g":"available","phase":"日常沟通"},{"day":35,"group":"职场","title":"介绍工作职责","ask":"What are your main responsibilities?","reply":"I coordinate warehouse operations and deliveries.","follow":"How large is your team?","questionZh":"你的主要职责是什么？","prompt":"请介绍两项物流工作职责。","g":"responsible","phase":"日常沟通"},{"day":36,"group":"职场","title":"询问进度","ask":"How is the sorting going?","reply":"We're about halfway through.","follow":"When do you expect to finish?","questionZh":"分拣进度如何？","prompt":"请说明作业已完成一半。","g":"progress","phase":"日常沟通"},{"day":37,"group":"职场","title":"强调正在处理","ask":"Are you checking the shipment now?","reply":"Yes, we're checking it right now.","follow":"Please tell me when you're done.","questionZh":"你现在在检查货件吗？","prompt":"请说明你正在检查货件。","g":"presentcont","phase":"日常沟通"},{"day":38,"group":"职场","title":"请求确认","ask":"Can you confirm the package count?","reply":"Yes, the final count is three thousand.","follow":"Does that include returns?","questionZh":"能确认包裹数量吗？","prompt":"请请求对方确认包裹数量。","g":"confirm","phase":"日常沟通"},{"day":39,"group":"职场","title":"解释缺件","ask":"Why is the count lower than expected?","reply":"We received fewer packages than the manifest shows.","follow":"Have you checked the missing list?","questionZh":"为什么数量比预期少？","prompt":"请解释实物件数少于清单。","g":"comparative","phase":"日常沟通"},{"day":40,"group":"职场","title":"货物重量差异","ask":"What's wrong with this shipment?","reply":"The actual weight is higher than the declared weight.","follow":"How much higher is it?","questionZh":"这批货有什么问题？","prompt":"请解释实际重量比申报重量高。","g":"comparative","phase":"日常沟通"},{"day":41,"group":"职场","title":"安排出库","ask":"When can the shipment leave?","reply":"It can leave after the final scan.","follow":"Who will approve the release?","questionZh":"什么时候可以发货？","prompt":"请说明最终扫描完成后即可出库。","g":"after","phase":"日常沟通"},{"day":42,"group":"职场","title":"提醒截止时间","ask":"When do you need the report?","reply":"I need it by five this afternoon.","follow":"Can you send it by email?","questionZh":"什么时候需要报告？","prompt":"请说明今天下午五点前要报告。","g":"bydeadline","phase":"日常沟通"},{"day":43,"group":"职场","title":"提出优先级","ask":"Which shipment should we handle first?","reply":"Let's prioritize the urgent shipment.","follow":"Can the other one wait?","questionZh":"先处理哪批货？","prompt":"请说明优先处理紧急货物。","g":"imperative","phase":"日常沟通"},{"day":44,"group":"职场","title":"说明已完成","ask":"Have you finished the inspection?","reply":"Yes, we've completed the inspection.","follow":"Did you find any issues?","questionZh":"检查结束了吗？","prompt":"请用现在完成时说明检查结束。","g":"presentperfect","phase":"日常沟通"},{"day":45,"group":"物流","title":"解释物流流程","ask":"What happens after the cargo arrives?","reply":"We unload, scan, sort, and prepare it for delivery.","follow":"How long does that usually take?","questionZh":"货物抵达后做什么？","prompt":"请说明四个基本仓库动作。","g":"sequence","phase":"日常沟通"},{"day":46,"group":"物流","title":"空运ETA","ask":"When is the flight expected to land?","reply":"The estimated arrival time is eight thirty.","follow":"Is that the latest update?","questionZh":"航班预计几点落地？","prompt":"请提供预计到达时间。","g":"estimated","phase":"工作场景"},{"day":47,"group":"物流","title":"迟到航班","ask":"Why hasn't the cargo arrived yet?","reply":"The flight was delayed due to bad weather.","follow":"Do you have a revised ETA?","questionZh":"货物为什么还没有到？","prompt":"请说明航班因天气原因延误。","g":"due","phase":"工作场景"},{"day":48,"group":"物流","title":"主单号确认","ask":"Can you verify the air waybill number?","reply":"Sure, I'll check the master air waybill.","follow":"Please send me the number once confirmed.","questionZh":"能核对空运提单号吗？","prompt":"请答应核对主运单号。","g":"will","phase":"工作场景"},{"day":49,"group":"物流","title":"出库数量","ask":"How many parcels are ready for dispatch?","reply":"About four thousand parcels are ready.","follow":"Can one truck handle them all?","questionZh":"多少包裹可以出库？","prompt":"请回答约四千票已备妥。","g":"quantifiers","phase":"工作场景"},{"day":50,"group":"物流","title":"派车能力","ask":"Do we need another truck tonight?","reply":"We may need a second truck if volume increases.","follow":"When will we make the decision?","questionZh":"今晚需要第二辆车吗？","prompt":"请说明货量增加时可能需要第二车。","g":"may","phase":"工作场景"},{"day":51,"group":"物流","title":"分批到货","ask":"Will all shipments arrive together?","reply":"No, the cargo will arrive in two batches.","follow":"When is the second batch due?","questionZh":"货物会一起到吗？","prompt":"请说明分两批到货。","g":"will","phase":"工作场景"},{"day":52,"group":"物流","title":"转运安排","ask":"Where will the cargo go next?","reply":"It will be transferred to our Tokyo warehouse.","follow":"When is the truck leaving?","questionZh":"货物下一站去哪里？","prompt":"请说明货物会转运东京仓库。","g":"passivefuture","phase":"工作场景"},{"day":53,"group":"物流","title":"分拣错误","ask":"Why was this parcel sent to the wrong area?","reply":"It was assigned the wrong sorting code.","follow":"How can we prevent that?","questionZh":"为什么包裹分错区域？","prompt":"请解释分拣码分配错误。","g":"passivepast","phase":"工作场景"},{"day":54,"group":"物流","title":"扫描异常","ask":"Why is the tracking status missing?","reply":"The scan wasn't uploaded correctly.","follow":"Can you resend the data?","questionZh":"为什么追踪状态缺失？","prompt":"请说明扫描数据未正确上传。","g":"passivepast","phase":"工作场景"},{"day":55,"group":"海关","title":"申报价值","ask":"How was the declared value calculated?","reply":"It was based on the actual transaction price.","follow":"Do you have proof of payment?","questionZh":"申报价值怎么计算？","prompt":"请说明申报价值基于实际成交价。","g":"based","phase":"工作场景"},{"day":56,"group":"海关","title":"进口者确认","ask":"Who is the importer of record?","reply":"The Japanese customer is the importer.","follow":"Who covers the import duties?","questionZh":"谁是正式进口者？","prompt":"请说明日本消费者为进口者。","g":"who","phase":"工作场景"},{"day":57,"group":"海关","title":"进口费用","ask":"Who pays the customs duties?","reply":"The sender advances the duties if they apply.","follow":"Is the customer charged later?","questionZh":"谁支付关税？","prompt":"请说明产生税费时由发货人先垫付。","g":"conditional","phase":"工作场景"},{"day":58,"group":"海关","title":"运输条款","ask":"Does the price include international shipping?","reply":"Shipping isn't charged separately to the customer.","follow":"How is the shipping cost handled?","questionZh":"价格包含国际运费吗？","prompt":"请解释消费者不会被另行收取运费。","g":"include","phase":"工作场景"},{"day":59,"group":"海关","title":"发票请求","ask":"Can you provide the commercial invoice?","reply":"Yes, I'll send the invoice and payment record.","follow":"When can you send them?","questionZh":"能提供商业发票吗？","prompt":"请承诺提供发票和支付凭证。","g":"and","phase":"工作场景"},{"day":60,"group":"海关","title":"说明价格折扣","ask":"Why is the discount so large?","reply":"The reference price is promotional, not the usual selling price.","follow":"Can you show recent sales records?","questionZh":"为什么折扣这么大？","prompt":"请解释参考价不是通常成交价。","g":"notbut","phase":"工作场景"},{"day":61,"group":"海关","title":"主动提供材料","ask":"What documents do you have available?","reply":"We have the order details and transaction records.","follow":"Could you send them today?","questionZh":"有什么资料可提供？","prompt":"请说明有订单详情和成交记录。","g":"have","phase":"工作场景"},{"day":62,"group":"海关","title":"修正申报信息","ask":"What should we do about the incorrect weight?","reply":"We need to verify the actual weight and correct the data.","follow":"Who will check the measurements?","questionZh":"重量信息错误怎么办？","prompt":"请说明核实实际重量并更正数据。","g":"needto","phase":"工作场景"},{"day":63,"group":"海关","title":"要求澄清","ask":"Could you clarify the shipping terms?","reply":"Certainly. I'll explain which costs the customer pays.","follow":"Please provide a written summary.","questionZh":"能澄清运输条件吗？","prompt":"请表示会说明顾客支付的费用。","g":"clarify","phase":"工作场景"},{"day":64,"group":"沟通","title":"跟进邮件","ask":"Have you had a chance to review my email?","reply":"Not yet. I'll review it this afternoon.","follow":"Could you update me by tomorrow?","questionZh":"你有机会看我的邮件吗？","prompt":"请说明下午会查看邮件。","g":"notyet","phase":"工作场景"},{"day":65,"group":"沟通","title":"礼貌催促","ask":"Could you give us an update on this issue?","reply":"We're still investigating and will update you soon.","follow":"Can you provide an estimated time?","questionZh":"能更新一下问题进展吗？","prompt":"请解释仍在调查并承诺更新。","g":"still","phase":"工作场景"},{"day":66,"group":"沟通","title":"问题原因","ask":"What caused the discrepancy?","reply":"It appears the shipping data contained an incorrect weight.","follow":"How did that happen?","questionZh":"差异原因是什么？","prompt":"请解释数据中可能有错误重量。","g":"appears","phase":"工作场景"},{"day":67,"group":"沟通","title":"请求证据","ask":"Do you have evidence to support that?","reply":"Yes, we can share the scan logs and photos.","follow":"Could you send those today?","questionZh":"有证据支持吗？","prompt":"请说明可提供扫描日志和照片。","g":"evidence","phase":"工作场景"},{"day":68,"group":"沟通","title":"表达不确定","ask":"Are you certain the truck can leave at midnight?","reply":"I'm not completely sure; we need to confirm the final volume.","follow":"When will you know?","questionZh":"确定午夜能发车吗？","prompt":"请谨慎表达不确定并说明还需确认货量。","g":"certainty","phase":"工作场景"},{"day":69,"group":"沟通","title":"给出条件","ask":"What happens if the flight arrives late?","reply":"If it arrives late, we'll adjust the dispatch schedule.","follow":"Will the customer be informed?","questionZh":"航班晚到怎么办？","prompt":"请解释若航班晚到会调整派车时间。","g":"if","phase":"工作场景"},{"day":70,"group":"沟通","title":"两种方案","ask":"What options do we have?","reply":"We can dispatch one truck now or wait for the remaining cargo.","follow":"Which option do you recommend?","questionZh":"有哪些选择？","prompt":"请提出立即发车或等待剩余货物两种方案。","g":"eitheror","phase":"工作场景"},{"day":71,"group":"沟通","title":"解释优缺点","ask":"Why do you prefer the first option?","reply":"It's faster, but it may increase transport costs.","follow":"Is the extra cost acceptable?","questionZh":"为何偏向第一方案？","prompt":"请解释速度更快但成本可能增加。","g":"tradeoff","phase":"工作场景"},{"day":72,"group":"沟通","title":"做出结论","ask":"What do you recommend we do?","reply":"I recommend dispatching after the last confirmed scan.","follow":"Can everyone agree on that?","questionZh":"建议怎么做？","prompt":"请提出基于最终确认扫描安排发车。","g":"recommend","phase":"工作场景"},{"day":73,"group":"进阶","title":"工作复盘","ask":"What went well during the last shift?","reply":"We processed the urgent shipments on time despite the delay.","follow":"What could we improve next time?","questionZh":"上一班次哪里做得好？","prompt":"请总结虽有延迟仍准时处理紧急货物。","g":"despite","phase":"独立表达"},{"day":74,"group":"进阶","title":"风险评估","ask":"What is the biggest risk tonight?","reply":"The biggest risk is a late arrival that pushes sorting past midnight.","follow":"How could we reduce that risk?","questionZh":"今晚最大风险是什么？","prompt":"请说晚到可能导致午夜后才能分拣。","g":"relative","phase":"独立表达"},{"day":75,"group":"进阶","title":"提高效率","ask":"How can we improve sorting efficiency?","reply":"We could reduce manual checks by improving data quality.","follow":"What would that change cost?","questionZh":"怎么提升分拣效率？","prompt":"请提出改善数据质量来减少人工核查。","g":"bying","phase":"独立表达"},{"day":76,"group":"进阶","title":"对比结果","ask":"Was this week better than last week?","reply":"Yes, the error rate was lower and processing was faster.","follow":"Which change helped the most?","questionZh":"这周比上周好吗？","prompt":"请比较错误率和处理速度。","g":"comparison","phase":"独立表达"},{"day":77,"group":"进阶","title":"解释根本原因","ask":"What is the root cause of these mistakes?","reply":"The root cause seems to be inconsistent data from the sender.","follow":"How will you prevent repeats?","questionZh":"错误根本原因是什么？","prompt":"请推测发货人数据不一致是根本原因。","g":"seemsto","phase":"独立表达"},{"day":78,"group":"进阶","title":"改善计划","ask":"What changes will you make next month?","reply":"We'll introduce validation rules before files are exported.","follow":"How will you measure the impact?","questionZh":"下个月有什么改进？","prompt":"请介绍将在导出前增加数据校验。","g":"plans","phase":"独立表达"},{"day":79,"group":"进阶","title":"说明流程依赖","ask":"Can we dispatch before customs clearance is complete?","reply":"No, the release must be confirmed before dispatch.","follow":"Who confirms the release?","questionZh":"清关没结束能发车吗？","prompt":"请说明必须先确认放行。","g":"must","phase":"独立表达"},{"day":80,"group":"进阶","title":"处理客户投诉","ask":"The customer says the parcel hasn't moved for two days.","reply":"I understand the concern. We'll check the tracking history and respond today.","follow":"Will you contact the carrier?","questionZh":"客户投诉两天没物流更新。","prompt":"请安抚客户，说明今天会核查并回复。","g":"empathy","phase":"独立表达"},{"day":81,"group":"进阶","title":"主动承担责任","ask":"Who will take responsibility for the correction?","reply":"I'll coordinate the investigation and share the results.","follow":"When can we expect the update?","questionZh":"谁负责更正？","prompt":"请主动承担协调调查与汇报的责任。","g":"ownership","phase":"独立表达"},{"day":82,"group":"独立","title":"澄清复杂问题","ask":"I'm not sure I understand the customs issue.","reply":"The main concern is whether the declared value matches the actual payment.","follow":"How can we prove that?","questionZh":"不太明白海关问题。","prompt":"请解释问题在于申报价是否匹配实际支付价。","g":"whether","phase":"独立表达"},{"day":83,"group":"独立","title":"避免误会","ask":"What do you mean by the final price?","reply":"I mean the total amount shown to the customer at checkout.","follow":"Does that include tax?","questionZh":"最终价格指什么？","prompt":"请澄清结账页面显示的总金额。","g":"imean","phase":"独立表达"},{"day":84,"group":"独立","title":"优先级谈判","ask":"Can you finish all the shipments before midnight?","reply":"We can prioritize the urgent ones, but we can't promise everything.","follow":"What is your realistic target?","questionZh":"午夜前能完成所有货物吗？","prompt":"请提出能优先处理紧急件，但不能保证全部完成。","g":"limits","phase":"独立表达"},{"day":85,"group":"独立","title":"提出数据依据","ask":"Why are you recommending a second truck?","reply":"Based on the current parcel volume, one truck may not be enough.","follow":"What is the threshold?","questionZh":"为什么建议第二辆车？","prompt":"请根据当前票数说明一车可能不够。","g":"basedon","phase":"独立表达"},{"day":86,"group":"独立","title":"委婉纠错","ask":"The manifest shows five hundred pieces. Is that correct?","reply":"Actually, the physical count is four hundred and eighty.","follow":"Can you check the difference?","questionZh":"清单显示500件对吗？","prompt":"请礼貌纠正：实物为480件。","g":"actually","phase":"独立表达"},{"day":87,"group":"独立","title":"谈判截止","ask":"Could you send us the corrected file in one hour?","reply":"We can try, but we need two hours to verify the records properly.","follow":"Can you send a partial update first?","questionZh":"一小时内能发修正文件吗？","prompt":"请解释核对需要两小时，并保持合作语气。","g":"negotiate","phase":"独立表达"},{"day":88,"group":"独立","title":"主动追问","ask":"The shipment is delayed and the customer is upset.","reply":"Could you tell me the revised ETA and what has already been communicated?","follow":"I'll check with the operations team.","questionZh":"货物延误且客户不满。","prompt":"请主动询问新ETA以及已通知客户什么。","g":"followup","phase":"独立表达"},{"day":89,"group":"独立","title":"完整方案说明","ask":"How will your new workflow reduce errors?","reply":"First, we'll validate the data. Then we'll scan each shipment and compare the results.","follow":"What happens if a mismatch appears?","questionZh":"新流程如何减少错误？","prompt":"请使用First/Then说明两步改善流程。","g":"sequence2","phase":"独立表达"},{"day":90,"group":"独立","title":"独立工作汇报","ask":"Could you summarize today's operations and next steps?","reply":"We handled the urgent cargo, identified one discrepancy, and will complete the follow-up tomorrow.","follow":"What support do you need?","questionZh":"能总结今日工作和下一步吗？","prompt":"请完整总结已做工作、发现的问题和下一步。","g":"summary","phase":"独立表达"}],"grammars":{"be":{"id":"be","title":"be动词 am / is / are","explanation":"I am Alex. She is ready.","pattern":"主语 + am/is/are + 身份或状态","example":"I am happy.","wrong":"I is happy.","tip":"I 后用 am；he/she/it 后用 is；you/we/they 后用 are。","answer":"am","stem":"I ___ ready.","options":["am","is","are"],"correct":"am"},"from":{"id":"from","title":"from / in 的区别","explanation":"I'm from China. I live in Japan.","pattern":"be from + 来源地；live in + 居住地","example":"I live in Osaka.","wrong":"I live at Japan.","tip":"国家城市前通常用 in，具体地址可用 at。","answer":"from","stem":"I am ___ China.","options":["from","in","at"],"correct":"from"},"simple":{"id":"simple","title":"一般现在时","explanation":"I work in logistics.","pattern":"主语 + 动词原形；he/she + 动词+s","example":"I work every day.","wrong":"She work every day.","tip":"第三人称单数动词需要 -s / -es。","answer":"works","stem":"She ___ in logistics.","options":["works","work","working"],"correct":"works"},"greeting":{"id":"greeting","title":"日常固定问答","explanation":"How are you? I'm fine, thanks.","pattern":"How are you? → 回应 + How about you?","example":"I'm doing well.","wrong":"I am goodly.","tip":"日常表达用 good 或 well，不用 goodly。","answer":"are","stem":"How ___ you today?","options":["are","is","do"],"correct":"are"},"can":{"id":"can","title":"情态动词 can","explanation":"Can you help me?","pattern":"can + 动词原形，不加 to / -s","example":"I can help.","wrong":"I can to help.","tip":"can 后直接接动词原形。","answer":"help","stem":"Can you ___ me?","options":["help","helps","to help"],"correct":"help"},"could":{"id":"could","title":"礼貌请求 could","explanation":"Could you repeat that, please?","pattern":"Could you + 动词原形 + please?","example":"Could you help me?","wrong":"Could you to help me?","tip":"could 比 can 通常更礼貌；后接动词原形。","answer":"repeat","stem":"Could you ___ that?","options":["repeat","repeats","to repeat"],"correct":"repeat"},"plural":{"id":"plural","title":"名词复数","explanation":"three packages","pattern":"数字 + 可数名词复数","example":"two boxes","wrong":"two box","tip":"两个以上可数名词用复数。","answer":"packages","stem":"three ___","options":["packages","package","packaging"],"correct":"packages"},"time":{"id":"time","title":"at + 精确时刻","explanation":"The meeting is at nine thirty.","pattern":"at + 时刻；on + 星期；in + 月份","example":"at 9:30","wrong":"in 9:30","tip":"具体时间点用 at。","answer":"at","stem":"The meeting is ___ nine.","options":["at","in","on"],"correct":"at"},"place":{"id":"place","title":"地点介词","explanation":"It's next to the bank.","pattern":"next to / across from / between","example":"next to the station","wrong":"next the station","tip":"next to 是完整词组。","answer":"to","stem":"It's next ___ the bank.","options":["to","at","in"],"correct":"to"},"would":{"id":"would","title":"I'd like 点餐","explanation":"I'd like a latte, please.","pattern":"I'd like + 名词 / to do","example":"I'd like a coffee.","wrong":"I like a coffee, please.","tip":"点单时 I'd like 通常更自然。","answer":"like","stem":"I'd ___ a latte.","options":["like","likes","liked"],"correct":"like"},"shortanswers":{"id":"shortanswers","title":"简短自然回答","explanation":"To go, please.","pattern":"问题的关键词 + please","example":"For here, please.","wrong":"Yes to going.","tip":"简短而自然的回答比死记完整句子更有效。","answer":"go","stem":"To ___, please.","options":["go","going","gone"],"correct":"go"},"howmuch":{"id":"howmuch","title":"How much / how many","explanation":"How much is it?","pattern":"how much + 不可数/价钱；how many + 数量","example":"How many boxes?","wrong":"How much boxes?","tip":"可数名词数量用 how many。","answer":"much","stem":"How ___ is this?","options":["much","many","long"],"correct":"much"},"thisthat":{"id":"thisthat","title":"this / these","explanation":"this item / these items","pattern":"this 单数；these 复数","example":"this package","wrong":"these package","tip":"these 后面一般用复数名词。","answer":"these","stem":"___ packages are ready.","options":["These","This","That"],"correct":"These"},"need":{"id":"need","title":"need + 名词 / to do","explanation":"I need a receipt.","pattern":"need + 名词；need to + 动词","example":"I need to check.","wrong":"I need check.","tip":"need 后接动词时通常加 to。","answer":"to","stem":"I need ___ check.","options":["to","for","at"],"correct":"to"},"direction":{"id":"direction","title":"问路句型","explanation":"How do I get to the station?","pattern":"How do I get to + 地点?","example":"How do I get to KIX?","wrong":"How can I to go KIX?","tip":"get to 是常用表达。","answer":"to","stem":"How do I get ___ the station?","options":["to","in","on"],"correct":"to"},"does":{"id":"does","title":"一般现在时疑问句","explanation":"Does this train go to KIX?","pattern":"Does + he/she/it/单数 + 动词原形?","example":"Does it arrive today?","wrong":"Does it arrives today?","tip":"does 出现后谓语动词保持原形。","answer":"go","stem":"Does this train ___ to KIX?","options":["go","goes","going"],"correct":"go"},"takes":{"id":"takes","title":"it takes 表示耗时","explanation":"It takes forty minutes.","pattern":"It takes + 时间 + to do","example":"It takes an hour.","wrong":"It take an hour.","tip":"形式主语 it 用 takes。","answer":"takes","stem":"It ___ thirty minutes.","options":["takes","take","taking"],"correct":"takes"},"here":{"id":"here","title":"here is / here are","explanation":"Here is my passport.","pattern":"Here is + 单数；Here are + 复数","example":"Here are the documents.","wrong":"Here is the documents.","tip":"复数文件用 Here are。","answer":"is","stem":"Here ___ my passport.","options":["is","are","be"],"correct":"is"},"presentcont":{"id":"presentcont","title":"现在进行时","explanation":"We are checking the cargo.","pattern":"be + 动词-ing，强调正在发生","example":"They are working.","wrong":"We checking now.","tip":"现在进行时一般需要 am/is/are。","answer":"are","stem":"We ___ checking now.","options":["are","is","do"],"correct":"are"},"where":{"id":"where","title":"特殊疑问词 where","explanation":"Where is gate twelve?","pattern":"Where + be/do/does + 主语?","example":"Where is the office?","wrong":"Where the office is?","tip":"直接问句通常倒装。","answer":"Where","stem":"___ is the gate?","options":["Where","When","Why"],"correct":"Where"},"future":{"id":"future","title":"询问未来安排","explanation":"What time will it depart?","pattern":"will + 动词原形","example":"It will arrive at six.","wrong":"It will arrives.","tip":"will 后接动词原形。","answer":"will","stem":"When ___ it depart?","options":["will","is","did"],"correct":"will"},"have":{"id":"have","title":"have / has","explanation":"I have a reservation.","pattern":"I/you/we/they have；he/she/it has","example":"She has a booking.","wrong":"She have a booking.","tip":"第三人称单数通常用 has。","answer":"have","stem":"I ___ a reservation.","options":["have","has","having"],"correct":"have"},"negative":{"id":"negative","title":"否定句","explanation":"The scanner isn't working.","pattern":"be + not / don't / doesn't","example":"It doesn't work.","wrong":"It don't work.","tip":"it 为第三人称单数，用 doesn't。","answer":"isn't","stem":"The printer ___ working.","options":["isn't","aren't","don't"],"correct":"isn't"},"fora":{"id":"fora","title":"for 表示用途/人数","explanation":"a table for two","pattern":"for + 受益人/人数/用途","example":"two tickets for us","wrong":"a table to two","tip":"表达“给两个人”用 for two。","answer":"for","stem":"A table ___ two, please.","options":["for","to","by"],"correct":"for"},"contain":{"id":"contain","title":"一般疑问句 contain","explanation":"Does this contain peanuts?","pattern":"Does + this + 动词原形?","example":"Does this contain milk?","wrong":"Does this contains milk?","tip":"does + 原形 contain。","answer":"contain","stem":"Does this ___ nuts?","options":["contain","contains","containing"],"correct":"contain"},"recommend":{"id":"recommend","title":"recommend + 名词/-ing","explanation":"I recommend visiting Kyoto.","pattern":"recommend + 名词 / doing","example":"I recommend taking a train.","wrong":"I recommend to taking train.","tip":"recommend 后常用动名词。","answer":"visiting","stem":"I recommend ___ Kyoto.","options":["visiting","visit","to visiting"],"correct":"visiting"},"frequency":{"id":"frequency","title":"频率副词","explanation":"I usually walk on weekends.","pattern":"频率副词一般放实义动词前","example":"I often cook.","wrong":"I cook often usually.","tip":"usually 位置通常在实义动词前。","answer":"usually","stem":"I ___ cook at home.","options":["usually","yesterday","tomorrow"],"correct":"usually"},"gerund":{"id":"gerund","title":"enjoy + -ing","explanation":"I enjoy taking photos.","pattern":"enjoy + 动名词","example":"I enjoy learning English.","wrong":"I enjoy to learn English.","tip":"enjoy 后接动词-ing。","answer":"taking","stem":"I enjoy ___ photos.","options":["taking","take","to take"],"correct":"taking"},"past":{"id":"past","title":"一般过去时","explanation":"I went shopping yesterday.","pattern":"过去时间 + 过去式","example":"I worked yesterday.","wrong":"I go yesterday.","tip":"过去完成的动作通常用过去时。","answer":"went","stem":"Yesterday, I ___ shopping.","options":["went","go","going"],"correct":"went"},"arrangements":{"id":"arrangements","title":"现在进行时表已安排的将来","explanation":"I'm meeting a friend tomorrow.","pattern":"be + -ing 可表已有安排","example":"I'm flying tomorrow.","wrong":"I meeting tomorrow.","tip":"be 不可省略。","answer":"meeting","stem":"I'm ___ a friend tomorrow.","options":["meeting","meet","met"],"correct":"meeting"},"because":{"id":"because","title":"because 连接原因","explanation":"I prefer coffee because it helps.","pattern":"原因 + because + 句子","example":"I stayed because it was important.","wrong":"because of it is late","tip":"because 后可直接接完整句子。","answer":"because","stem":"I chose it ___ it is faster.","options":["because","but","and"],"correct":"because"},"but":{"id":"but","title":"but 转折","explanation":"It's useful, but expensive.","pattern":"句子A + but + 句子B","example":"It's small but strong.","wrong":"It good but small.","tip":"形容词表语前通常需要be动词。","answer":"but","stem":"It's useful, ___ expensive.","options":["but","because","so"],"correct":"but"},"politerefusal":{"id":"politerefusal","title":"礼貌拒绝","explanation":"Thanks, but I already have plans.","pattern":"感谢 + 理由 + 下次机会","example":"Thanks, maybe next time.","wrong":"No I hate.","tip":"拒绝也可保持礼貌和边界。","answer":"but","stem":"Thanks, ___ I have plans.","options":["but","or","if"],"correct":"but"},"available":{"id":"available","title":"available 的自然用法","explanation":"I'm available on Thursday.","pattern":"be available + on/at","example":"I'm free after seven.","wrong":"I available Thursday.","tip":"available 是形容词，前面需要be。","answer":"available","stem":"I'm ___ after work.","options":["available","availability","availably"],"correct":"available"},"thanks":{"id":"thanks","title":"回应感谢","explanation":"You're welcome.","pattern":"You're welcome / No problem / Happy to help","example":"Happy to help.","wrong":"You are welcomed.","tip":"You're welcome 没有 -d。","answer":"welcome","stem":"You're ___.","options":["welcome","welcomed","welcoming"],"correct":"welcome"},"responsible":{"id":"responsible","title":"负责做某事","explanation":"I'm responsible for deliveries.","pattern":"be responsible for + 名词/-ing","example":"I'm responsible for checking data.","wrong":"responsible to checking","tip":"for 后用名词或动名词。","answer":"for","stem":"I'm responsible ___ sorting.","options":["for","to","at"],"correct":"for"},"progress":{"id":"progress","title":"进度表达","explanation":"We're halfway through.","pattern":"be + halfway through + 工作","example":"We're almost done.","wrong":"We halfway done.","tip":"状态表达通常有be动词。","answer":"through","stem":"We're halfway ___ the work.","options":["through","between","during"],"correct":"through"},"confirm":{"id":"confirm","title":"请求确认","explanation":"Could you confirm the quantity?","pattern":"confirm + 名词/that 从句","example":"Please confirm the count.","wrong":"Please confirm me the count.","tip":"通常 confirm the count，不说 confirm me the count。","answer":"confirm","stem":"Please ___ the quantity.","options":["confirm","confirms","confirmed"],"correct":"confirm"},"comparative":{"id":"comparative","title":"比较级","explanation":"The actual weight is higher.","pattern":"higher/lower/faster + than","example":"The count is lower than expected.","wrong":"more high than","tip":"短形容词通常用 -er。","answer":"than","stem":"The weight is higher ___ expected.","options":["than","then","that"],"correct":"than"},"after":{"id":"after","title":"after + 名词/-ing","explanation":"after the final scan","pattern":"after + 名词 / after doing","example":"after checking the data","wrong":"after to check","tip":"after 后接动词通常用 -ing。","answer":"after","stem":"We leave ___ the scan.","options":["after","before","during"],"correct":"after"},"bydeadline":{"id":"bydeadline","title":"by 截止时间","explanation":"by five this afternoon","pattern":"by = 不晚于；at = 恰好","example":"Finish by noon.","wrong":"finish at noon by","tip":"注意 by 与 at 的时间差异。","answer":"by","stem":"Please reply ___ five.","options":["by","at","since"],"correct":"by"},"imperative":{"id":"imperative","title":"祈使句和Let's","explanation":"Let's prioritize urgent cargo.","pattern":"Let's + 动词原形","example":"Let's check first.","wrong":"Let's to check.","tip":"let's 后接动词原形。","answer":"prioritize","stem":"Let's ___ urgent cargo.","options":["prioritize","prioritizes","prioritizing"],"correct":"prioritize"},"presentperfect":{"id":"presentperfect","title":"现在完成时","explanation":"We've finished the inspection.","pattern":"have/has + 过去分词","example":"I have checked it.","wrong":"I have check it.","tip":"完成时用过去分词。","answer":"finished","stem":"We've ___ the work.","options":["finished","finish","finishing"],"correct":"finished"},"sequence":{"id":"sequence","title":"流程连接词","explanation":"First, we scan. Then, we sort.","pattern":"First / Then / Finally","example":"First, check the data.","wrong":"First we checking.","tip":"动作说明用动词原形。","answer":"Then","stem":"First scan, ___ sort.","options":["Then","Because","Although"],"correct":"Then"},"estimated":{"id":"estimated","title":"预计时间用语","explanation":"The estimated arrival time is 8:30.","pattern":"estimated = 预计；actual = 实际","example":"The actual arrival was 9:00.","wrong":"estimated means actual","tip":"预计与实际不要混淆。","answer":"estimated","stem":"The ___ arrival time is 8:30.","options":["estimated","estimating","estimate"],"correct":"estimated"},"due":{"id":"due","title":"due to + 名词","explanation":"The flight was delayed due to weather.","pattern":"due to + 名词；because + 句子","example":"due to bad weather","wrong":"due to it rained","tip":"due to 后不能直接接完整动词句。","answer":"to","stem":"The delay was due ___ weather.","options":["to","for","by"],"correct":"to"},"will":{"id":"will","title":"will 表示承诺","explanation":"I'll check and get back to you.","pattern":"will + 动词原形","example":"I'll update you today.","wrong":"I will checked it.","tip":"will 后动词原形。","answer":"check","stem":"I'll ___ the manifest.","options":["check","checked","checking"],"correct":"check"},"quantifiers":{"id":"quantifiers","title":"数量量词","explanation":"about four thousand parcels","pattern":"about / approximately / nearly","example":"roughly 4,000 packages","wrong":"four thousands parcels","tip":"明确数词后 thousand 不加s。","answer":"thousand","stem":"about four ___ parcels","options":["thousand","thousands","thousand of"],"correct":"thousand"},"may":{"id":"may","title":"may 表示可能性","explanation":"We may need another truck.","pattern":"may/might + 动词原形","example":"It might be delayed.","wrong":"It may needs.","tip":"情态动词后接动词原形。","answer":"need","stem":"We may ___ another truck.","options":["need","needs","needed"],"correct":"need"},"passivefuture":{"id":"passivefuture","title":"一般将来时被动","explanation":"It will be transferred to Tokyo.","pattern":"will be + 过去分词","example":"It will be delivered.","wrong":"It will be deliver.","tip":"将来被动要用过去分词。","answer":"be","stem":"It will ___ transferred.","options":["be","been","being"],"correct":"be"},"passivepast":{"id":"passivepast","title":"一般过去时被动","explanation":"It was assigned incorrectly.","pattern":"was/were + 过去分词","example":"The file was uploaded.","wrong":"The file was upload.","tip":"被动语态需要过去分词。","answer":"was","stem":"It ___ assigned incorrectly.","options":["was","were","be"],"correct":"was"},"based":{"id":"based","title":"be based on","explanation":"It was based on the real price.","pattern":"be based on + 名词","example":"It's based on the records.","wrong":"based from the data","tip":"是 based on，不是 based from。","answer":"on","stem":"The price is based ___ records.","options":["on","at","in"],"correct":"on"},"who":{"id":"who","title":"who 主语问句","explanation":"Who is the importer?","pattern":"Who + be + 名词?","example":"Who is responsible?","wrong":"Who importer is?","tip":"直接问句通常倒装。","answer":"Who","stem":"___ is the importer?","options":["Who","Where","When"],"correct":"Who"},"conditional":{"id":"conditional","title":"if 表示条件","explanation":"If duties apply, the sender pays.","pattern":"If + 现在时, will/can + 动词","example":"If it rains, we'll wait.","wrong":"If it will rain, we will wait.","tip":"第一条件句 if 从句通常用现在时。","answer":"If","stem":"___ duties apply, we'll pay.","options":["If","When","But"],"correct":"If"},"include":{"id":"include","title":"include 的范围","explanation":"The price includes shipping.","pattern":"include + 名词/-ing","example":"It includes domestic delivery.","wrong":"It including shipment.","tip":"一般现在时需要正确动词形式。","answer":"includes","stem":"The price ___ shipping.","options":["includes","include","including"],"correct":"includes"},"and":{"id":"and","title":"and 连结两项","explanation":"I'll send the invoice and record.","pattern":"A and B","example":"We checked and approved it.","wrong":"invoice with and record","tip":"两个并列名词直接用 and。","answer":"and","stem":"invoice ___ receipt","options":["and","but","or"],"correct":"and"},"notbut":{"id":"notbut","title":"not A but B","explanation":"It's a reference price, not the sale price.","pattern":"not A, but B","example":"It's an estimate, not a guarantee.","wrong":"not but a price","tip":"不要把参考价格说成实际成交价格。","answer":"not","stem":"It's a reference price, ___ the usual price.","options":["not","no","none"],"correct":"not"},"needto":{"id":"needto","title":"need to + 动词","explanation":"We need to verify the weight.","pattern":"need to + 动词原形","example":"We need to investigate.","wrong":"We need verify.","tip":"need to 不要漏 to。","answer":"to","stem":"We need ___ verify the weight.","options":["to","for","with"],"correct":"to"},"clarify":{"id":"clarify","title":"clarify / explain","explanation":"Let me clarify the charges.","pattern":"clarify + 名词；explain + 名词","example":"Could you clarify the terms?","wrong":"explain me the terms","tip":"explain 后通常直接接内容，不直接接人。","answer":"clarify","stem":"Please ___ the terms.","options":["clarify","clarifies","clarified"],"correct":"clarify"},"notyet":{"id":"notyet","title":"yet 与现在完成时","explanation":"I haven't checked it yet.","pattern":"haven't/hasn't + 过去分词 + yet","example":"I haven't received it yet.","wrong":"I didn't received yet.","tip":"否定完成时用 haven't + 过去分词。","answer":"yet","stem":"I haven't checked it ___.","options":["yet","already","still"],"correct":"yet"},"still":{"id":"still","title":"still 表示持续","explanation":"We're still investigating.","pattern":"be + still + -ing","example":"I'm still waiting.","wrong":"I still am investigating.","tip":"常见语序是 We're still checking。","answer":"still","stem":"We're ___ checking.","options":["still","yet","already"],"correct":"still"},"appears":{"id":"appears","title":"似乎/推测","explanation":"It appears the data is incorrect.","pattern":"It appears that + 句子","example":"It seems that we're late.","wrong":"It appears to incorrect.","tip":"appear + to be 或 that 从句。","answer":"appears","stem":"It ___ the count is wrong.","options":["appears","appear","appearing"],"correct":"appears"},"evidence":{"id":"evidence","title":"evidence 不可数","explanation":"We have evidence to support it.","pattern":"evidence通常是不可数名词","example":"strong evidence","wrong":"many evidences","tip":"常说 some evidence，不说 evidences。","answer":"evidence","stem":"We have enough ___ to explain.","options":["evidence","evidences","evident"],"correct":"evidence"},"certainty":{"id":"certainty","title":"不确定的谨慎表达","explanation":"I'm not completely sure yet.","pattern":"not sure / likely / unlikely","example":"It seems likely.","wrong":"It sure maybe.","tip":"将推测与事实区分。","answer":"sure","stem":"I'm not completely ___ yet.","options":["sure","surely","certainty"],"correct":"sure"},"if":{"id":"if","title":"第一条件句","explanation":"If it arrives late, we'll adjust.","pattern":"If + 现在时，主句 will","example":"If needed, we'll call.","wrong":"If it will arrive late","tip":"条件从句通常用现在时。","answer":"arrives","stem":"If it ___ late, we'll adjust.","options":["arrives","will arrive","arriving"],"correct":"arrives"},"eitheror":{"id":"eitheror","title":"两种选择","explanation":"We can leave now or wait.","pattern":"A or B","example":"We can scan or hold it.","wrong":"We either can and wait.","tip":"或者用 or，不是 and。","answer":"or","stem":"We can dispatch ___ wait.","options":["or","and","but"],"correct":"or"},"tradeoff":{"id":"tradeoff","title":"利弊句","explanation":"It's faster, but more expensive.","pattern":"优点 + but + 代价","example":"It's safer but slower.","wrong":"more faster but","tip":"比较级 faster 前不再加 more。","answer":"but","stem":"It's faster, ___ costs more.","options":["but","so","because"],"correct":"but"},"despite":{"id":"despite","title":"despite + 名词/-ing","explanation":"We finished despite the delay.","pattern":"despite + 名词/-ing；although + 句子","example":"despite the traffic","wrong":"despite it was late","tip":"despite 后不直接接独立句。","answer":"despite","stem":"We finished ___ the delay.","options":["despite","although","because"],"correct":"despite"},"relative":{"id":"relative","title":"that 引导定语从句","explanation":"a delay that affects dispatch","pattern":"名词 + that + 说明","example":"a problem that needs fixing","wrong":"a problem who needs","tip":"物通常可用 that/which。","answer":"that","stem":"a delay ___ causes problems","options":["that","who","where"],"correct":"that"},"bying":{"id":"bying","title":"by + -ing 表方法","explanation":"We improve accuracy by checking data.","pattern":"by + 动词-ing","example":"by reducing errors","wrong":"by reduce errors","tip":"by 后面的动作通常用 -ing。","answer":"by","stem":"We improve quality ___ checking.","options":["by","to","at"],"correct":"by"},"comparison":{"id":"comparison","title":"比较两个指标","explanation":"lower error rates and faster processing","pattern":"more / less / -er","example":"fewer errors","wrong":"less packages","tip":"可数复数常用 fewer 而不是 less。","answer":"fewer","stem":"We made ___ mistakes.","options":["fewer","less","little"],"correct":"fewer"},"seemsto":{"id":"seemsto","title":"seem to + 动词","explanation":"The data seems to be incorrect.","pattern":"seem(s) to + 动词原形","example":"It seems to work.","wrong":"It seem work.","tip":"第三人称单数 seems，后接 to。","answer":"seems","stem":"It ___ to be incorrect.","options":["seems","seem","seeming"],"correct":"seems"},"plans":{"id":"plans","title":"未来计划 will/going to","explanation":"We're going to add validation.","pattern":"be going to + 动词","example":"We'll introduce checks.","wrong":"We going to change.","tip":"be going to 前需要be。","answer":"going","stem":"We're ___ to improve it.","options":["going","go","gone"],"correct":"going"},"must":{" function homePage(){const doneCount=LESSONS.filter(l=>completed(l.day)).length,pct=Math.round(doneCount/90*100),d=LESSONS[db.day-1],due=dueWords().length,com=Object.values(db.done).reduce((x,a)=>x+['listen','grammar','speak','review'].filter(k=>a[k]).length,0);return `${headSection('YOUR DAILY BRIEF','英语要能真正说出口。','每天45分钟 · 听懂、独立表达、纠正、再用一次。')}<div class="hero"><div class="caps">DAY ${db.day} / 90 · ${H(d.group)}</div><h2>${H(d.title)}<br>今天把英语用起来。</h2><p>不是刷完几道题，而是在不看答案时，真正说出有意义的一句话。</p><button class="button dark" data-act="start">开始今天的实战 →</button></div><div class="grid" style="margin-top:13px"><div class="metric"><strong>${doneCount}<span style="display:inline;font-size:13px"> / 90</span></strong><span>完整训练日</span></div><div class="metric"><strong>${due}</strong><span>待复习词汇</span></div><div class="metric"><strong>${com}</strong><span>已完成的练习项</span></div></div><div class="section-title"><h2>今日路线</h2><small>建议 45 min</small></div>${[['listen','◉','盲听理解','先听，别急着看字幕 · 10分钟'],['grammar','≡','语法迁移','讲解 + 防错 + 造句 · 7分钟'],['speak','♬','独立表达','先说后看答案 · 18分钟'],['review','▦','记忆复现','主动回忆 + 间隔复习 · 7分钟']].map(([id,ico,t,desc])=>`<button class="tile" data-practice="${id}"><span class="ic">${done()[id]?'✓':ico}</span><span class="grow"><b>${t}</b><small>${desc}</small></span><span class="arr">›</span></button>`).join('')}<div class="panel alt"><div class="flex between"><div><div class="kicker">THE MOST IMPORTANT HABIT</div><h3 style="margin:6px 0">复述 + 纠错 + 第二次输出</h3></div><span class="chip">3分钟</span></div><p class="muted small">先自己说一次，再听参考句或让AI修正，最后关掉答案重新说一遍。真正的进步发生在第二次。</p><button class="button" data-nav="coach">打开AI真人对话训练 →</button></div>${db.legacy?'<div class="note">已发现旧版 Speak90 数据并记录为历史资料。新版练习成绩不会被旧版“点击完成”自动填满，避免虚高。</div>':''}<div class="buttons"><button class="button" data-nav="grammar">打开系统语法库 →</button><button class="button" data-nav="pron">发音 / 拼写特训 →</button><button class="button" data-nav="settings">设置 / 备份学习记录 →</button></div><div class="section-title"><h2>90天目标</h2><small>${pct}% 已完成</small></div><div class="stepbar"><span style="width:${pct}%"></span></div><p class="tiny muted">前30天建立可用句型 · 中30天提升工作和旅行交流 · 后30天练习追问、解释和独立汇报。</p>`}
function planPage(){return `${headSection('ROADMAP · 90 DAYS','每一天都有独立任务。','每节课包含真实提问、重点语法、无脚本回答及中日双语词汇。')}<div class="flex between"><div class="chips">${['全部','起步','生活','旅行','社交','职场','物流','海关','沟通','进阶','独立'].map(x=>`<button class="button sm ${stageFilter===x?'primary':''}" data-filter="${H(x)}">${H(x)}</button>`).join('')}</div></div><div class="panel"><div class="calendar">${LESSONS.map(l=>`<button data-day="${l.day}" class="daybox ${l.day===db.day?'current':''} ${completed(l.day)?'finished':''}"><b>${l.day}</b><span>${completed(l.day)?'✓':(db.done[l.day]?'进行中':l.group)}</span></button>`).join('')}</div><p class="tiny muted" style="margin-bottom:0">点日期进入课程。可以提前预览；只有实际完成的项目才记入进度。</p></div><div class="section-title"><h2>主题列表</h2><small>${LESSONS.filter(l=>stageFilter==='全部'||l.group===stageFilter).length}课</small></div>${LESSONS.filter(l=>stageFilter==='全部'||l.group===stageFilter).map(l=>`<button class="tile" data-day="${l.day}"><span class="ic">${completed(l.day)?'✓':l.day}</span><span class="grow"><b>${H(l.title)}</b><small>Day ${l.day} · ${H(l.group)} · ${H(l.questionZh)}</small></span><span class="arr">›</span></button>`).join('')}`}
function practicePage(){const l=LESSONS[lessonDay-1],g=GRAM[l.g],d=done(lessonDay);return `${headSection(`DAY ${lessonDay} · ${H(l.group)}`,H(l.title),'同一个情境，从“听懂”推进到“脱离参考答案独立表达”。')}<div class="flex between"><div class="chips"><span class="chip">${H(l.phase)}</span><span class="chip purple">${Object.values(d).filter(Boolean).length}/4 项</span></div><button class="button sm" data-nav="plan">更换课程</button></div><div class="trainingnav">${[['listen','① 盲听'],['grammar','② 语法'],['speak','③ 开口'],['review','④ 复习']].map(([k,t])=>`<button class="${exercise===k?'on':''}" data-exercise="${k}">${d[k]?'✓ ':''}${t}</button>`).join('')}</div>${({listen:listenView,grammar:grammarView,speak:speakView,review:reviewView})[exercise](l,g)}${completed(lessonDay)?`<div class="goodbox">✓ Day ${lessonDay} 的四项训练已记录完成。这里记录的是训练行为和客观题结果，不能等同于英语水平测评。<div class="buttons"><button class="button primary" data-act="next-day">前往下一天 →</button></div></div>`:''}`}
function listenView(l){const opts=chooseListenOptions(l.day),a=db.answers[l.day]?.listen;return `<div class="panel"><div class="kicker">LISTEN FIRST · 不看字幕</div><h2>对方在问什么？</h2><p class="muted small">先只听英文，最多听3遍，再判断含义。答案提交后才会解锁原文。</p><div class="buttons"><button class="button primary" data-act="hear" >▶ 听英文提问</button><button class="button" data-act="hear-slow">◀ 0.7× 慢速</button></div>${opts.map((t,i)=>`<button class="option ${listenPick===i?'selected':''}" data-listen="${i}">${String.fromCharCode(65+i)} · ${H(t)}</button>`).join('')}<div class="buttons"><button class="button primary" data-act="listen-submit">检查听力</button><button class="button ghost" data-act="listen-reveal">${seeListen?'隐藏':'显示'}原文与翻译</button></div>${a?`<div class="${a.correct?'goodbox':'warnbox'}">${a.correct?'✓ 这次理解正确。':'这次理解没有对上，重新听一遍再作答。'}<br><strong>原句：</strong> ${H(l.ask)}<br><span class="muted">${H(l.questionZh)}</span><div class="buttons"><button class="button sm" data-act="hear">再听一次</button></div></div>`:seeListen?`<div class="note">原句：${H(l.ask)}<br>中文：${H(l.questionZh)}<br>看过原文后的选择不能算严格“盲听”。</div>`:''}</div><div class="panel"><div class="kicker">NEXT · 对话轮换</div><p>听懂后，你需要自己回答，而不是仅会选择正确答案。</p><div class="chatbubble"><b>OTHER PERSON</b><p>${H(l.ask)}</p></div><div class="chatbubble you"><b>YOUR RESPONSE · YOUR TURN</b><p>现在轮到你。先在③开口页不看参考答案独立回答，再决定是否揭示范例。</p></div><div class="chatbubble"><b>FOLLOW-UP</b><p>${a||seeListen?H(l.follow):"先完成听力，再解锁对方的追问。"}</p></div><button class="button primary" data-exercise="speak">前往③开口独立回答 →</button><p class="tiny muted">为了避免背答案，参考回复只会在口语页面由你主动揭示。</p></div>`}
function grammarView(l,g){const rec=db.grammar[lessonDay];return `<div class="panel"><div class="kicker">GRAMMAR IN CONTEXT / ${H(g.title)}</div><h2>${H(g.title)}</h2><p>${H(g.explanation)}</p><div class="promptbox"><div class="kicker">规律</div><div class="en" style="font-size:17px;margin:7px 0">${H(g.pattern)}</div><p class="small" style="margin:0;color:#c9dcde">${H(g.tip)}</p></div><div class="section-title"><h2>正确 / 错误对比</h2></div><div class="goodbox">✓ ${H(g.example)}</div><div class="warnbox">✕ ${H(g.wrong)}</div><div class="section-title"><h2>先做一次，不看答案</h2></div><p><b>${H(g.stem)}</b></p>${grammarOptions(g,lessonDay).map((x,i)=>`<button data-gram-option="${i}" class="option ${grammarPick===i?'selected':''}">${String.fromCharCode(65+i)} · ${H(x)}</button>`).join('')}<div class="buttons"><button class="button primary" data-act="grammar-submit">检查语法</button><button class="button" data-act="gram-listen">▶ 听例句</button></div>${rec?`<div class="${rec.correct?'goodbox':'warnbox'}">${rec.correct?'✓ 正确。再用自己的信息造一个新句子。':'答案还不正确，需要再试一次。'}<br><b>答案：${H(g.correct)}</b><br>${H(g.tip)}</div>`:''}</div><div class="panel"><div class="kicker">TRANSFER · 迁移练习</div><h3>用自己的信息重新造句</h3><p class="small muted">不要照抄上面的例句。尝试替换地点、时间、数量或动作。</p><textarea id="gramSentence" class="textarea" placeholder="在这里尝试造句，随后到AI教练进行自然语言纠错">${H(db.answers[lessonDay]?.gramSentence||'')}</textarea><div class="buttons"><button class="button" data-act="save-gram-sentence">保存造句</button><button class="button" data-nav="coach">让AI检查新句子 →</button></div></div>`}
function speakView(l){let entry=(db.expressions[lessonDay]||[]).slice(-1)[0],spk=db.drafts?.[lessonDay]??entry?.text??'';return `<div class="panel"><div class="kicker">SPEAK WITHOUT A SCRIPT</div><h2>先说，再看参考答案。</h2><p class="muted small">先把答案用英语说出来；不需要完美，但不要直接照抄。你可以使用键盘英语听写，不依赖 Safari 自动识别接口。</p><div class="promptbox"><div class="kicker">SITUATION · 实战任务</div><p class="en">${H(l.prompt)}</p><div class="cn">对方的问题：${H(l.questionZh)}</div></div><div class="buttons"><button class="button" data-act="ask-play">▶ 听对方提问</button><button class="button" data-act="focus-dictation">⌨ 使用iPhone键盘听写</button></div><div class="field"><label>你的英文回答（先说话，再让系统听写成文字；也可以手动输入）</label><textarea id="speakInput" class="textarea" placeholder="先说出来，再将英文填写到这里……">${H(spk)}</textarea></div><div class="field"><label>你通过什么方式完成？</label><select id="speakMethod"><option value="typing">手动输入：只记录写作练习</option><option value="dictation">iPhone 英语键盘听写：我确实开口说了</option><option value="recording">网页录音或语音备忘录：我确实开口说了</option></select></div><div class="buttons"><button class="button primary" data-act="check-speak">提交回答 · 获取有限的词汇对照</button><button class="button" data-act="reveal-answer">${seeAnswer?'隐藏':'查看'}参考答案</button></div>${entry?.checked?`<div class="goodbox">✓ 已保存${entry.method==='typing'?'文字表达':'口头练习记录'}。词汇对照仅供发现缺漏，<b>不能证明语法、发音或自然度正确</b>。建议让AI教练检查，并关掉参考句重说一次。</div>`:''}${seeAnswer?`<div class="note"><b>参考回答：</b> ${H(l.reply)}<div class="buttons"><button class="button sm" data-act="reply-play">▶ 听标准表达</button></div><b>对方进一步追问：</b> ${H(l.follow)}<p class="tiny muted">答案只是一个自然表达范例，不是唯一正确说法。</p></div>`:''}</div><div class="panel"><div class="kicker">AUDIO LAB · 声音工具</div><h3>独立录音与回听</h3><p class="muted small">和自动转文字是两套独立功能。iOS不允许网页录音时，可选择语音备忘录导入。</p><div class="buttons"><button class="button ${rec.mode==='recording'?'warn':'primary'}" data-act="rec-toggle">${rec.mode==='recording'?'■ 结束录音':'● 开始网页录音'}</button><label class="button" style="cursor:pointer">导入本机音频<input id="audioImport" type="file" accept="audio/*,.m4a,.mp3,.wav,.aac,.webm" style="display:none"></label><button class="button ghost" data-act="mic-check">录音失败怎么办？</button></div><div class="recstatus" id="recStatus">${H(rec.error||(rec.mode==='recording'?'正在录音……请点击结束录音。':rec.mode==='ready'?'录音已生成，使用下方播放器试听。':'尚未录音。'))}</div><div id="audioBox"></div></div><div class="panel alt"><div class="kicker">REAL CONVERSATION</div><h3>真正的口语反馈来自追问和纠错</h3><p class="muted small">让AI扮演真实对话者，连续追问，不提前提供示范答案；然后针对最重要的错误要求重说。</p><button class="button primary" data-nav="coach">进入AI情景对话 →</button></div>`}
function reviewView(l){let pool=reviewPool(),word=pool[reviewWordIndex%Math.max(pool.length,1)],v=getW(word),due=dueWords().length;if(!v)return '<div class="panel">没有需要复习的词汇。</div>';return `<div class="panel"><div class="flex between"><div class="kicker">ACTIVE RECALL · 自己回忆</div><span class="counter">${reviewWordIndex%pool.length+1} / ${pool.length}</span></div><p class="small muted">先说出中文意思，再试着造一个英文句子，然后翻卡。不是看一眼就算掌握。</p><div class="wordhero"><span class="chip">${H(v.pos)}</span><h2>${H(v.w)}</h2>${v.ipa?`<p class="phon">${H(v.ipa)} · 美音参考</p>`:''}<div class="buttons" style="justify-content:center"><button class="button sm" data-say="${H(v.w)}">▶ 听读音</button><button class="button sm" data-act="flip-word">${reviewShow?'隐藏释义':'查看释义'}</button></div>${reviewShow?`<div class="zh">${H(v.zh)}</div><div class="ja">${H(v.ja)}</div><p class="small">${H(v.ex)}</p>`:''}</div>${reviewShow?`<div class="section-title"><h2>你刚才记得多少？</h2></div><div class="grid" style="grid-template-columns:repeat(2,1fr)"><button class="button" data-srs="0" data-w="${H(word)}">忘了 · 15分钟</button><button class="button" data-srs="1" data-w="${H(word)}">困难 · 明天</button><button class="button" data-srs="2" data-w="${H(word)}">记得 · 间隔</button><button class="button primary" data-srs="3" data-w="${H(word)}">非常熟 · 延长</button></div>`:`<div class="note">想起意思和一个例句以后，再翻面检查。${due?`当前另有 ${due} 个到期词汇。`:''}</div>`}<div class="buttons"><button class="button" data-word="${H(word)}">查看这个词的完整精讲</button><button class="button" data-act="finish-review">结束本日复习</button></div></div>`}

function settingsPage(){return `${headSection('MY DATA · SAFETY FIRST','设置与学习记录','学习资料存储在本机浏览器，不会自动同步到你的账号。')}<div class="panel"><h2>个性化设置</h2><div class="field"><label>英文名字 / 自称</label><input class="input" id="yourName" value="${H(db.name)}" placeholder="Alex"></div><div class="field"><label>翻译显示</label><select id="yourLang"><option value="both" ${db.lang==='both'?'selected':''}>中文 + 日文</option><option value="zh" ${db.lang==='zh'?'selected':''}>仅中文</option><option value="ja" ${db.lang==='ja'?'selected':''}>仅日文</option></select></div><div class="field"><label>英文朗读速度</label><select id="yourSpeed">${[['0.7','0.7× 慢速'],['0.88','0.88× 学习速度'],['1','1.0× 自然速度']].map(([v,t])=>`<option value="${v}" ${Math.abs(db.speed-Number(v))<.01?'selected':''}>${t}</option>`).join('')}</select></div><button class="button primary" data-act="save-settings">保存设置</button></div><div class="panel"><h2>数据备份与恢复</h2><p class="muted small">升级HTML、清理Safari缓存或更换设备前，请先导出备份。清除浏览器网站数据可能导致丢失进度。</p><div class="buttons"><button class="button primary" data-act="export">导出所有学习数据 JSON</button><label class="button">导入备份文件<input id="backupFile" type="file" accept=".json,application/json" style="display:none"></label></div><div class="note">支持 v3 本机备份以及 v2 旧版数据迁移。旧版记录不会被当作新版考试成绩；旧版学习数据备份保存在历史区。</div></div><div class="panel"><h2>iPhone 语音诊断</h2><p class="muted small">为避免iOS Safari语音识别在媒体播放后无返回值，新版不再依赖自动语音识别 API。可使用英语键盘听写或语音备忘录。</p><div class="buttons"><button class="button" data-act="test-mic">检查浏览器能否请求麦克风</button><button class="button" data-act="test-tts">测试英文朗读</button></div><p class="tiny muted" id="diagnostic">设备权限检查结果将显示在这里。</p></div><div class="panel"><h2>关于这个版本</h2><p><b>Speak90 Atlas v3.0</b> · 90天独立课程 · ${LEX.length}条精讲词汇 · ${Object.keys(GRAM).length}个语法知识点。</p><p class="muted small">这是独立运行的学习应用，并不等同于接入了付费 AI API。AI教练由你已有的 ChatGPT 对话承担，需要手动复制/导入报告。课程以英语训练为目的，不构成实际海关法律意见。</p><p class="muted small">由于 iPhone WebKit 的音频限制，录音回放和语音合成仍可能受设备/权限影响。优先用 Safari、HTTPS、系统听写，不保证所有设备表现一致。</p></div>`}
function assessmentPage(key){const milestone=Number(key),as=db.assessments[milestone]||{key:milestone,at:localDay(),listen:{},grammar:{},written:'',oral:'',finished:false};let items=assessQuestionItems(key),i=Math.floor(assessmentStep/2),type=assessmentStep%2===0?'listen':'grammar';if(assessmentStep>=10){return `${headSection(`CHECKPOINT · DAY ${milestone}`,'最后：两段自由表达','请在没有参考答案的情况下连续说出来，并用系统听写或录音保留证据。')}<div class="panel"><div class="promptbox"><p>① 用英语在30秒内介绍自己、工作，以及最近的一件事。</p><p>② 用英语在30~60秒内解释一项延误或工作问题、原因和下一步措施。</p></div><div class="field"><label>表达1：英文文本或系统听写</label><textarea class="textarea" id="testSpeak1" placeholder="请先口头说，再记录英文">${H(as.written||'')}</textarea></div><div class="field"><label>表达2：英文文本或系统听写</label><textarea class="textarea" id="testSpeak2" placeholder="请先口头说，再记录英文">${H(as.oral||'')}</textarea></div><div class="buttons"><button class="button primary" data-act="finish-assess" data-which="${milestone}">保存完整测评</button></div></div>`}let q=items[i],options=type==='listen'?chooseListenOptions(q.l.day):grammarOptions(q.g,q.l.day),stem=type==='listen'?q.l.questionZh:q.g.stem,answered=type==='listen'?as.listen[i]:as.grammar[i];return `${headSection(`CHECKPOINT · DAY ${milestone}`,`第 ${assessmentStep+1}/10 题 · ${type==='listen'?'听力':'语法'}`,'尽量一次作答，不要查词典。系统只计算有限客观题的正确率。')}<div class="panel"><div class="kicker">${type==='listen'?'LISTEN & CHOOSE · 只听不看':'GRAMMAR · APPLY THE RULE'}</div><h2>${type==='listen'?'听懂对方问的是什么':H(stem)}</h2>${type==='listen'?'<button class="button primary" data-act="assess-hear" data-which="'+milestone+'">▶ 播放英文提问</button>':''}${options.map((o,j)=>`<button class="option ${assessmentChoice===j?'selected':''}" data-assess-option="${j}">${String.fromCharCode(65+j)} · ${H(o)}</button>`).join('')}<div class="buttons"><button class="button primary" data-act="assess-next" data-which="${milestone}">提交并进入下一题 →</button></div>${answered?`<p class="muted tiny">已保存上次作答：${answered.ok?'正确':'错误'}；继续作答会重新覆盖本题记录。</p>`:''}</div>`}

function renderAssessment(key){assessKey=String(key);$('#screen').innerHTML=assessmentPage(assessKey);$('#topStatus').textContent=`Checkpoint Day ${key} · ${assessmentStep+1}/12`}
function aiImport(raw){try{let clean=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');let m=clean.match(/\{[\s\S]*\}/);if(!m)throw Error('找不到JSON对象');let r=JSON.parse(m[0]);if(r.speak90_report!==3||!Number.isInteger(r.day)||r.day<1||r.day>90||!Array.isArray(r.observations))throw Error('不是有效Speak90 v3报告（需要speak90_report=3、day和observations）');if(r.observations.length>30)throw Error('错误条数超出上限');let report={day:r.day,date:String(r.date||localDay()).slice(0,30),turns:clamp(r.turns||0,0,100),observations:r.observations.map(x=>({original:String(x.original||'').slice(0,300),correction:String(x.correction||'').slice(0,300),category:String(x.category||'AI纠错').slice(0,30),why:String(x.why||'').slice(0,200)})).filter(x=>x.original&&x.correction),strengths:Array.isArray(r.strengths)?r.strengths.slice(0,10):[],next_drills:Array.isArray(r.next_drills)?r.next_drills.slice(0,10):[],imported:localDay()};for(const x of report.observations)addError(x.category,x.original,x.correction,'ChatGPT Day '+r.day);db.aiReports.unshift(report);db.aiReports=db.aiReports.slice(0,80);db.done[r.day]??={};db.done[r.day].coach=true;save();toast(`已导入：${report.observations.length}条纠错，${report.turns}轮对话`);render()}catch(e){toast('导入失败：'+e.message)}}
function copy(t){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>toast('已复制到剪贴板，可以粘贴到ChatGPT')).catch(()=>fallbackCopy(t));else fallbackCopy(t)}
function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.top='0';document.body.append(a);a.select();try{document.execCommand('copy');toast('已尝试复制，请粘贴到ChatGPT查看')}catch(e){toast('复制失败，请手动选择文本')}a.remove()}
function exportFile(){db.backupAt=localDay();save();const data=JSON.stringify({format:'speak90-atlas-backup',version:3,exported:localDay(),payload:db},null,2);const blob=new Blob([data],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`Speak90-Atlas-backup-${localDay()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('已生成备份文件，请到下载项确认保存成功')}
function restoreFile(raw){try{let x=JSON.parse(raw),newDB=null;if(x.format==='speak90-atlas-backup'&&x.version===3&&x.payload?.schema===3)newDB=x.payload;else if(x.schema===3)newDB=x;else if(x.version===2&&x.done){newDB=baseState();newDB.day=clamp(x.day,1,90);newDB.name=String(x.name||'');newDB.lang=x.lang||'both';newDB.legacy={source:'外部 v2 备份',day:x.day,oldData:x};}else throw Error('不支持的备份结构');if(!Number.isInteger(newDB.day)||newDB.day<1||newDB.day>90)throw Error('天数无效');if(!confirm('导入将覆盖当前 Speak90 v3 学习记录。建议先导出当前备份。继续吗？'))return;db={...baseState(),...newDB};lessonDay=db.day;save();go('home');toast('学习记录已恢复')}catch(e){toast('备份文件无法导入：'+e.message)}}
function downloadAudio(){if(!rec.blob)return toast('还没有音频');let ext=rec.blob.type.includes('mp4')?'m4a':rec.blob.type.includes('webm')?'webm':'audio';let a=document.createElement('a');a.href=rec.url;a.download=`Speak90-Day${lessonDay}-${localDay()}.${ext}`;document.body.append(a);a.click();a.remove()}
function showAudio(){const el=$('#audioBox');if(!el)return;el.innerHTML=rec.url?`<audio controls preload="metadata" src="${H(rec.url)}"></audio><div class="buttons"><button class="button sm" data-act="save-audio">保存本次录音</button></div>`:''}
async function startRec(){if(!navigator.mediaDevices?.getUserMedia){rec.error='当前浏览器没有提供网页麦克风。请使用 iPhone「语音备忘录」录音后导入。';render();return}try{speechSynthesis?.cancel();if(rec.url){URL.revokeObjectURL(rec.url);rec.url=null;rec.blob=null}let stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});rec.stream=stream;if(!window.MediaRecorder){rec.error='此浏览器未提供MediaRecorder。请使用语音备忘录。';stream.getTracks().forEach(t=>t.stop());rec.stream=null;render();return}let mime=['audio/mp4','audio/webm;codecs=opus','audio/webm',''].find(x=>!x||MediaRecorder.isTypeSupported(x))||'';let recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);rec.recorder=recorder;rec.chunks=[];rec.error='';rec.mode='recording';rec.started=now();recorder.ondataavailable=e=>{if(e.data?.size>0)rec.chunks.push(e.data)};recorder.onerror=e=>{rec.error='录音器报告错误：'+(e.error?.message||'未知错误')};recorder.onstop=()=>{let chunks=rec.chunks,blob=new Blob(chunks,{type:recorder.mimeType||'audio/mp4'});stream.getTracks().forEach(t=>t.stop());rec.stream=null;rec.recorder=null;if(blob.size<800){rec.mode='idle';rec.error='录音数据为空或太短。请确认麦克风权限，或使用语音备忘录导入。'}else{rec.blob=blob;rec.url=URL.createObjectURL(blob);rec.mode='ready';rec.error=`成功收到约 ${(blob.size/1024).toFixed(1)} KB 音频。请点击播放器试听，确认是否有声音。`}render();};recorder.start(500);toast('开始录音。请说话，然后点结束录音');render()}catch(e){rec.mode='idle';rec.error='无法使用麦克风：'+(e.name||'')+' '+(e.message||'')+'。请在 Safari 网站设置中允许麦克风，或改用语音备忘录。';rec.stream?.getTracks().forEach(t=>t.stop());rec.stream=null;render()}}
function stopRec(){if(rec.recorder?.state==='recording'){try{rec.recorder.requestData();rec.recorder.stop();toast('正在整理录音文件…')}catch(e){rec.error='无法正常停止录音：'+e.message;rec.mode='idle';rec.stream?.getTracks().forEach(t=>t.stop());render()}}}
function saveSpeak(){let val=$('#speakInput')?.value.trim()||'',method=$('#speakMethod')?.value||'typing';if(wordTokens(val).length<3)return toast('请至少写出3个英文单词，再进行对照');db.drafts[lessonDay]=val;db.expressions[lessonDay]??=[];db.expressions[lessonDay].push({text:val,method,checked:true,day:localDay(),assisted:seeAnswer});db.expressions[lessonDay]=db.expressions[lessonDay].slice(-10);setDone('speak');render();toast(method==='typing'?'已记入文字练习（不计为真实开口）':'已记入自报口头练习；没有自动给发音评分')}
function markListen(){let l=LESSONS[lessonDay-1];if(listenPick===null)return toast('先选一个答案');const options=chooseListenOptions(lessonDay),correct=options[listenPick]===l.questionZh;db.answers[lessonDay]??={};let oldListen=db.answers[lessonDay].listen;db.answers[lessonDay].listen={selected:listenPick,correct:correct,firstCorrect:oldListen?.firstCorrect??correct,attempts:(oldListen?.attempts||0)+1,assisted:!!(db.answers[lessonDay].peeked||oldListen?.assisted||seeListen),at:localDay()};if(correct){setDone('listen')}else{addError('听力',options[listenPick],l.questionZh,'Day '+lessonDay);save()}seeListen=true;render();toast(correct?'理解正确，准备回答下一轮':'已保存错题，建议再听一次并重新作答')}
function markGrammar(){if(grammarPick===null)return toast('先选一个答案');let g=GRAM[LESSONS[lessonDay-1].g],correct=grammarOptions(g,lessonDay)[grammarPick]===g.correct;let oldGrammar=db.grammar[lessonDay];db.grammar[lessonDay]={choice:grammarPick,correct,firstCorrect:oldGrammar?.firstCorrect??correct,attempts:(oldGrammar?.attempts||0)+1,at:localDay()};if(correct)setDone('grammar');else{addError('语法',g.stem.replace('___',grammarOptions(g,lessonDay)[grammarPick]),g.stem.replace('___',g.correct),'Day '+lessonDay);save()}render();toast(correct?'回答正确':'已记录语法错误，请理解规律后重试')}
function finishReview(){let n=dayWords(lessonDay).filter(w=>db.srs[w]?.last===localDay()).length;if(n<3)return toast(`今天至少需要主动回忆3个词。目前完成 ${n}/3。`);setDone('review');render();toast('今日词汇任务已完成')}
function nextDay(){if(lessonDay>=90)return toast('90天课程已全部开放。请进行第90天结业测评。');db.day=lessonDay+1;lessonDay=db.day;exercise='listen';listenPick=grammarPick=null;seeListen=seeAnswer=false;reviewWordIndex=0;save();go('practice')}
function addCustom(){let w=($('#newWord')?.value||'').trim().toLowerCase(),zh=($('#newZh')?.value||'').trim(),ja=($('#newJa')?.value||'').trim(),ex=($('#newExample')?.value||'').trim();if(!/^[a-z][a-z '\-]{1,55}$/i.test(w)||!zh||!ja||!ex)return toast('请填写合法英文、中文、日文及例句');if(getW(w))return toast('词库中已有同名词条');db.custom.push({w,zh,ja,ex,coll:'自定义词条：尚未审核搭配',tip:'请让AI教练确认使用方式',pos:'custom',forms:'',ipa:'',level:'custom'});save();wordSelected=w;wordMode='search';render();toast('已添加自定义词条')}
function assessmentNext(key){const items=assessQuestionItems(key),i=Math.floor(assessmentStep/2),type=assessmentStep%2===0?'listen':'grammar',q=items[i];if(assessmentChoice===null)return toast('请选择一个答案');let as=db.assessments[key]||{day:key,listen:{},grammar:{},at:localDay()},opts=type==='listen'?chooseListenOptions(q.l.day):grammarOptions(q.g,q.l.day);let correct=type==='listen'?opts[assessmentChoice]===q.l.questionZh:opts[assessmentChoice]===q.g.correct;as[type][i]={choice:assessmentChoice,ok:correct};db.assessments[key]=as;assessmentStep++;assessmentChoice=null;save();renderAssessment(key)}
function finishAssessment(key){let a=db.assessments[key];if(!a)return toast('还没有完成客观题');let written=$('#testSpeak1')?.value.trim()||'',oral=$('#testSpeak2')?.value.trim()||'';if(wordTokens(written).length<4||wordTokens(oral).length<4)return toast('需要分别完成两段不少于4个英语单词的独立表达');a.written=written;a.oral=oral;a.finished=true;a.finishedAt=localDay();a.objective=[...Object.values(a.listen),...Object.values(a.grammar)].filter(q=>q.ok).length;a.caveat='客观题分数不等于口语等级；两段表达未经AI审核';save();assessKey=null;go('stats');toast(`测评保存成功：客观题 ${a.objective}/10。口语需进一步人工/AI复核。`)}
function doAct(act,el){switch(act){case 'sound-next':soundIndex=(soundIndex+1)%SOUNDS.length;render();break;case 'spell-sound':speech(LEX[(spellingIndex*13+7)%LEX.length].w,.84);break;case 'spell-next':spellingIndex++;spellRevealed=false;render();break;case 'spell-check':{let w=LEX[(spellingIndex*13+7)%LEX.length],a=norm($('#spellingInput')?.value||'');if(!a)return toast('先听音再拼写');let ok=a===norm(w.w);if(!ok)addError('拼写',a,w.w,'听音拼写训练');db.recent.unshift({type:'spelling',w:w.w,correct:ok,at:localDay()});db.recent=db.recent.slice(0,200);save();spellRevealed=true;render();toast(ok?'拼写正确':'拼写有误，已加入纠错复习');break}case 'start':lessonDay=db.day;exercise='listen';go('practice');break;case 'hear':speech(LESSONS[lessonDay-1].ask);break;case 'hear-slow':speech(LESSONS[lessonDay-1].ask,.7);break;case 'dialog-play':{let l=LESSONS[lessonDay-1];speech(`${l.ask} ... ${l.reply} ... ${l.follow}`,db.speed);break}case 'listen-submit':markListen();break;case 'listen-reveal':seeListen=!seeListen;if(seeListen){db.answers[lessonDay]??={};db.answers[lessonDay].peeked=true;save()}render();break;case 'grammar-submit':markGrammar();break;case 'gram-listen':speech(GRAM[LESSONS[lessonDay-1].g].example);break;case 'save-gram-sentence':db.answers[lessonDay]??={};db.answers[lessonDay].gramSentence=($('#gramSentence')?.value||'').slice(0,1000);save();toast('句子已保存，AI教练会纳入今日反馈');break;case 'ask-play':speech(LESSONS[lessonDay-1].ask);break;case 'reply-play':speech(LESSONS[lessonDay-1].reply);break;case 'focus-dictation':{$('#speakInput')?.focus();toast('切换英文键盘，点击键盘自己的🎤听写');break}case 'check-speak':saveSpeak();break;case 'reveal-answer':seeAnswer=!seeAnswer;render();break;case 'rec-toggle':if(rec.mode==='recording')stopRec();else startRec();break;case 'mic-check':alert('iPhone 推荐：①用 Safari 打开 HTTPS 网站；②在 Safari 网站设置里允许麦克风；③开始录音时点“允许”；④如果网页录音失败，使用系统“语音备忘录”录好后点“分享→存储到文件”，回本页导入音频；⑤键盘麦克风听写与网页录音是不同功能。');break;case 'save-audio':downloadAudio();break;case 'flip-word':reviewShow=!reviewShow;render();break;case 'finish-review':finishReview();break;case 'next-day':nextDay();break;case 'learn-this':{let w=el.dataset.w;db.srs[w]??={interval:0,ease:2.5,n:0,lapses:0,due:now()};save();toast('已加入间隔复习');break}case 'add-word':addCustom();break;case 'copy-coach':copy(coachPrompt());break;case 'open-chatgpt':window.open('https://chatgpt.com/','_blank','noopener,noreferrer');break;case 'show-prompt':{let box=$('#promptPreview');box.innerHTML=box.innerHTML?'':`<details open><summary>今日教练指令</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#c4d5d8">${H(coachPrompt())}</pre></details>`;break}case 'import-ai':aiImport($('#aiReport')?.value||'');break;case 'save-material':db.journal=($('#realMaterial')?.value||'').slice(0,7000);save();toast('本机材料已保存');break;case 'copy-material':{let s=($('#realMaterial')?.value||'').slice(0,7000);if(!s.trim())return toast('先粘贴一段真实英文材料');copy('你是专业英语教练。请基于这段英文材料：\n'+s+'\n先给我英文B1以下的简短英文摘要和必要中文日文释义；接着一次只问我一个问题，要求我独立英文复述，然后纠正错误并变换条件继续追问。请避免重复原文作为答案，至少5轮。');break}case 'save-settings':db.name=($('#yourName')?.value||'').slice(0,40);db.lang=$('#yourLang')?.value||'both';db.speed=Number($('#yourSpeed')?.value||.88);save();render();toast('设置保存完成');break;case 'export':exportFile();break;case 'test-mic':{const el2=$('#diagnostic');if(!navigator.mediaDevices?.getUserMedia){el2.textContent='此浏览器未提供getUserMedia。请用Safari HTTPS或语音备忘录。';break}el2.textContent='正在请求麦克风权限……';navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{let tracks=s.getAudioTracks();el2.textContent='麦克风权限允许；检测到 '+tracks.length+' 条音轨。此结果不保证录音文件与回放一定正常。';s.getTracks().forEach(t=>t.stop())}).catch(e=>el2.textContent='权限/设备错误：'+e.name+' '+e.message);break}case 'test-tts':speech('Hello. This is a Speak90 English sound test.');break;case 'error-pass':reviewError(el.dataset.error,true);break;case 'error-fail':reviewError(el.dataset.error,false);break;case 'assess-hear':{let items=assessQuestionItems(assessKey);speech(items[Math.floor(assessmentStep/2)].l.ask);break}case 'assess-next':assessmentNext(Number(el.dataset.which));break;case 'finish-assess':finishAssessment(Number(el.dataset.which));break;default:break}}
document.addEventListener('click',e=>{let t=e.target.closest('[data-act],[data-nav],[data-practice],[data-exercise],[data-day],[data-word],[data-say],[data-gram-option],[data-listen],[data-srs],[data-grammar],[data-word-mode],[data-assess-option],[data-assess],[data-filter]');if(!t)return;const d=t.dataset;if(d.act)return doAct(d.act,t);if(d.nav){assessKey=null;return go(d.nav)}if(d.practice){assessKey=null;exercise=d.practice;lessonDay=db.day;return go('practice')}if(d.exercise){exercise=d.exercise;reviewWordIndex=0;reviewShow=false;return render()}if(d.day){lessonDay=Number(d.day);exercise='listen';listenPick=grammarPick=null;seeListen=seeAnswer=false;reviewWordIndex=0;return go('practice')}if(d.listen!==undefined){listenPick=Number(d.listen);return render()}if(d.gramOption!==undefined){grammarPick=Number(d.gramOption);return render()}if(d.srs!==undefined){gradeWord(d.w,Number(d.srs));return}if(d.word){wordSelected=d.word;wordMode='search';page='words';return render()}if(d.say){speech(d.say);return}if(d.grammar){grammarSelected=d.grammar;return render()}if(d.wordMode){wordMode=d.wordMode;return render()}if(d.filter){stageFilter=d.filter;return render()}if(d.assess){assessmentStep=0;assessmentChoice=null;return renderAssessment(d.assess)}if(d.assessOption!==undefined){assessmentChoice=Number(d.assessOption);return renderAssessment(assessKey)}});
document.addEventListener('change',async e=>{if(e.target.id==='audioImport'){let f=e.target.files?.[0];if(f){if(f.size>60*1024*1024)return toast('音频超出60MB上限');if(rec.url)URL.revokeObjectURL(rec.url);rec.blob=f;rec.url=URL.createObjectURL(f);rec.mode='ready';rec.error=`已导入 ${f.name}（${(f.size/1024).toFixed(1)}KB）。请点击试听。`;render();toast('音频导入成功，不会自动转文字')}e.target.value=''}else if(e.target.id==='backupFile'){let f=e.target.files?.[0];if(f){if(f.size>8*1024*1024)return toast('备份文件超过8MB，请先确认文件来源');restoreFile(await f.text())}e.target.value=''}});
// search fields don't rerender on every keystroke before caret movement
let inputDelay=null;document.addEventListener('input',e=>{if(e.target.id==='speakInput'){db.drafts[lessonDay]=e.target.value.slice(0,2000);clearTimeout(inputDelay);inputDelay=setTimeout(save,250)}else if(e.target.id==='wordSearch'){wordQuery=e.target.value;clearTimeout(inputDelay);inputDelay=setTimeout(()=>{let pos=wordQuery.length;render();let el=$('#wordSearch');el?.focus();el?.setSelectionRange(pos,pos)},230)}else if(e.target.id==='grammarSearch'){grammarQuery=e.target.value;clearTimeout(inputDelay);inputDelay=setTimeout(()=>{let pos=grammarQuery.length;render();let el=$('#grammarSearch');el?.focus();el?.setSelectionRange(pos,pos)},230)}});
// Keep clipboard and app functional even if an optional browser capability is unavailable.
window.addEventListener('pagehide',()=>{if(rec.stream)rec.stream.getTracks().forEach(t=>t.stop())});
render();
